[pytest]
addopts = -ra -q --strict-markers --tb=short -p no:warnings -p no:cacheprovider
testpaths = .
python_files = test_*.py
markers =
    smoke: smoke tests (fast, no external dependencies)
timeout = 30
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
