# Project configuration file for Python tools
# Used by Black, isort, mypy, and other tools

[tool.black]
# Line length
line-length = 100

# Python versions to target
target-version = ['py312']

# Include files matching these patterns
include = '\.pyi?$'

# Exclude files matching these patterns
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | \.env
  | build
  | dist
  | \.eggs
  | \.pytest_cache
  | \.mypy_cache
  | __pycache__
  | migrations
  | alembic
  | node_modules
)/
'''

# Use single quotes for strings
# skip-string-normalization = false

# Use magic trailing comma
# skip-magic-trailing-comma = false

# Preview style
# preview = false


[tool.isort]
# Profile to use (black-compatible)
profile = "black"

# Line length
line_length = 100

# Python version
py_version = 312

# Known third-party packages
known_third_party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "redis",
    "aio_pika",
    "pytest",
    "pandas",
    "numpy",
    "sklearn",
    "tensorflow",
    "torch",
]

# Known first-party packages
known_first_party = ["services", "shared"]

# Sections for imports
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# Multi-line output mode (3 = vertical hanging indent)
multi_line_output = 3

# Include trailing comma
include_trailing_comma = true

# Force grid wrap
force_grid_wrap = 0

# Use parentheses for line continuation
use_parentheses = true

# Ensure newline before comments
ensure_newline_before_comments = true

# Split on trailing comma
split_on_trailing_comma = true

# Files to skip
skip = [
    ".venv",
    "venv",
    "env",
    ".env",
    "build",
    "dist",
    ".eggs",
    "__pycache__",
    "migrations",
    "alembic",
]

# Glob patterns for files to skip
skip_glob = [
    "**/.venv/*",
    "**/venv/*",
    "**/migrations/*",
    "**/alembic/*",
]


[tool.mypy]
# Python version
python_version = "3.12"

# Disallow untyped definitions
disallow_untyped_defs = true

# Disallow incomplete definitions
disallow_incomplete_defs = true

# Check untyped definitions
check_untyped_defs = true

# Disallow untyped calls
disallow_untyped_calls = false

# Disallow untyped decorators
disallow_untyped_decorators = false

# Warn about redundant casts
warn_redundant_casts = true

# Warn about unused ignores
warn_unused_ignores = true

# Warn about no return
warn_no_return = true

# Warn about unreachable code
warn_unreachable = true

# Strict optional
strict_optional = true

# Strict equality
strict_equality = true

# Show error codes
show_error_codes = true

# Show column numbers
show_column_numbers = true

# Pretty output
pretty = true

# Color output
color_output = true

# Error summary
error_summary = true

# Files to exclude
exclude = [
    'venv/',
    '.venv/',
    'build/',
    'dist/',
    'migrations/',
    'alembic/',
]

# Namespace packages
namespace_packages = true

# Ignore missing imports (for third-party libraries without stubs)
ignore_missing_imports = false

# Follow imports
follow_imports = "normal"

# Show none errors
show_none_errors = true

# Warn about return any
warn_return_any = true

# Plugins
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "setuptools.*",
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "tensorflow.*",
    "torch.*",
    "aio_pika.*",
    "pybit.*",
]
ignore_missing_imports = true


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true


[tool.pytest.ini_options]
# See pytest.ini for full configuration
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["services/*/tests", "tests"]


[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
    "*/alembic/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


[tool.bandit]
# Bandit security linting configuration
exclude_dirs = [
    "/tests/",
    "/.venv/",
    "/venv/",
    "/build/",
    "/dist/",
]

# Tests to skip
skips = [
    # B101: assert_used - we use asserts in tests
    "B101",
    # B601: paramiko_calls - if we use paramiko, it's intentional
    # "B601",
]

# Severity level
level = "MEDIUM"

# Confidence level
confidence = "MEDIUM"


[tool.pylint.main]
# Python version
py-version = "3.12"

# Files or directories to be skipped
ignore = [
    "CVS",
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    "alembic",
]

# Pickle collected data for later comparisons
persistent = true

# Use multiple processes
jobs = 0

# Maximum line length
max-line-length = 100

# Disable specific warnings
disable = [
    "missing-docstring",
    "invalid-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "fixme",
]

# Good variable names
good-names = [
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_",
    "id",
    "db",
]

[tool.pylint.format]
# Maximum line length
max-line-length = 100

# Maximum number of lines in a module
max-module-lines = 1000

# String used as indentation unit
indent-string = "    "

[tool.pylint.design]
# Maximum number of arguments
max-args = 10

# Maximum number of attributes
max-attributes = 15

# Maximum number of boolean expressions
max-bool-expr = 5

# Maximum number of branch
max-branches = 12

# Maximum number of locals
max-locals = 15

# Maximum number of parents
max-parents = 7

# Maximum number of public methods
max-public-methods = 20

# Maximum number of return statements
max-returns = 6

# Maximum number of statements
max-statements = 50

# Minimum number of public methods
min-public-methods = 0


[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"


[project]
name = "crypto-trading-bot"
version = "1.0.0"
description = "Autonomous cryptocurrency trading bot with microservices architecture"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DevOps Team", email = "devops@crypto-bot.example.com"}
]
keywords = [
    "cryptocurrency",
    "trading",
    "bot",
    "microservices",
    "bybit",
    "technical-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "pylint>=3.0.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/your-org/crypto-trading-bot"
Documentation = "https://docs.crypto-bot.example.com"
Repository = "https://github.com/your-org/crypto-trading-bot"
"Bug Tracker" = "https://github.com/your-org/crypto-trading-bot/issues"
