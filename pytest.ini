# pytest configuration for the entire project
# This configuration is used by all services and CI/CD pipelines

[pytest]
# Minimum pytest version required
minversion = 6.0

# Additional command-line options applied by default
addopts =
    # Show test summary for all test outcomes
    -ra
    # Quiet mode (less verbose output)
    -q
    # Strict marker checking (fail on unknown markers)
    --strict-markers
    # Strict configuration checking
    --strict-config
    # Coverage options
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-branch
    # Show local variables in tracebacks
    --showlocals
    # Verbose tracebacks
    --tb=short
    # Disable warnings capture
    -p no:warnings
    # Enable asyncio mode
    --asyncio-mode=auto

# Test discovery patterns
testpaths =
    services/*/tests
    tests

# Test file patterns
python_files =
    test_*.py
    *_test.py

# Test class patterns
python_classes =
    Test*
    *Tests
    *Test

# Test function patterns
python_functions =
    test_*

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (tests with external dependencies)
    e2e: End-to-end tests (full system tests)
    slow: Slow running tests (skip with -m "not slow")
    security: Security-related tests
    performance: Performance and load tests
    smoke: Smoke tests (basic functionality checks)
    database: Tests requiring database
    redis: Tests requiring Redis
    rabbitmq: Tests requiring RabbitMQ
    api: API endpoint tests
    websocket: WebSocket tests
    bybit: Tests requiring Bybit API (may use mock or testnet)
    ml: Machine learning model tests
    skip_ci: Tests to skip in CI environment
    ml_on: opt-in tests requiring ENABLE_ML_PREDICTIONS=true (CD-05; nightly+manual via `pytest -m ml_on`)
    golden: golden-sample parity tests requiring the running docker stack

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*
    */migrations/*
    */alembic/*
    setup.py

[coverage:report]
# Fail if coverage is below this percentage
fail_under = 80

# Precision of coverage percentage
precision = 2

# Show missing line numbers
show_missing = true

# Exclude lines from coverage
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about type checking code
    if TYPE_CHECKING:
    # Don't complain about protocol methods
    \.\.\.

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# Asyncio configuration
[asyncio]
asyncio_mode = auto

# Logging configuration for tests
[pytest.logging]
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300
timeout_method = thread

# Disable cacheprovider plugin for CI
cache_dir = .pytest_cache

# JUnit XML output for CI/CD
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true
junit_duration_report = total

# Test collection configuration
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    node_modules
    .pytest_cache
    htmlcov

# Doctest configuration
doctest_optionflags =
    NORMALIZE_WHITESPACE
    ELLIPSIS

# Console output styling
console_output_style = progress

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore specific third-party warnings
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*HTTPResponse.getheader.*:DeprecationWarning

# Environment variables for tests
[pytest:env]
ENVIRONMENT = test
TESTING = true
DEBUG = false
