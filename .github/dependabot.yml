# Dependabot configuration — grouped monthly updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Rewritten 2026-08-04: the old per-package weekly config accumulated 65 stale
# PRs (Dec 2025) that rotted against a frozen main. Policy now:
#   - monthly cadence, ONE grouped PR per service directory
#   - small open-pull-requests limits so a red CI can't breed a backlog
#   - known-landmine majors ignored; take them as deliberate migrations:
#       * fastapi/starlette frozen — api-gateway pins fastapi 0.109 on purpose
#         (HTTPBearer 403-vs-401 test contract, see .claude/rules/testing.md)
#       * pydantic/pydantic-settings frozen — 2.5→2.12 changes settings
#         deep-merge behavior (documented in .claude/rules/testing.md)
#       * numpy 2.x — breaks tensorflow 2.16 / pandas 2.2 ABI in ml services
#       * pytest 9 / pytest-asyncio 1.x — breaking majors, migrate in lockstep
#       * python-json-logger 3+ / redis 6+ — breaking majors
#       * react 19 family, @vitejs/plugin-react 5, zustand 5 — React 18 frontend

version: 2
updates:
  # ---------- GitHub Actions: one grouped PR ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-all:
        patterns: ["*"]

  # ---------- Python: one grouped PR per service ----------
  - package-ecosystem: "pip"
    directories:
      - "/services/api-gateway"
      - "/services/trading-engine"
      - "/services/portfolio-manager"
      - "/services/technical-analysis"
      - "/services/bybit-connector"
      - "/services/market-data-service"
      - "/services/notification-service"
      - "/services/ml-prediction-service"
      - "/services/risk-metrics-service"
      - "/services/sentiment-analysis-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "starlette"
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-settings"
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-asyncio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python-json-logger"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tensorflow"
        update-types: ["version-update:semver-major"]

  # ---------- Docker base images: one grouped PR per service ----------
  - package-ecosystem: "docker"
    directories:
      - "/services/api-gateway"
      - "/services/trading-engine"
      - "/services/portfolio-manager"
      - "/services/technical-analysis"
      - "/services/bybit-connector"
      - "/services/market-data-service"
      - "/services/notification-service"
      - "/services/ml-prediction-service"
      - "/services/risk-metrics-service"
      - "/services/sentiment-analysis-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-base:
        patterns: ["*"]
    ignore:
      # Stay on the 3.12 line — services are built and tested against it.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ---------- npm (frontend): one grouped PR ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
