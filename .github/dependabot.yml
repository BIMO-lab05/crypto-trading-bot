# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependencies for all services
  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    labels:
      - "dependencies"
      - "python"
      - "api-gateway"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    open-pull-requests-limit: 10
    reviewers:
      - "devops-team"
    assignees:
      - "devops-team"

  - package-ecosystem: "pip"
    directory: "/services/trading-engine"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    labels:
