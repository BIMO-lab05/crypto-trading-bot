name: Tournament Harness CI

on:
  push:
    branches: [main]
    paths:
      - "services/tournament-harness/**"
      - "services/ml-retraining-service/app/core/models/**"
      - "infrastructure/migrations/005_tournament_reader.sql"
      - ".github/workflows/tournament-harness.yml"
  pull_request:
    paths:
      - "services/tournament-harness/**"
      - "services/ml-retraining-service/app/core/models/**"
      - "infrastructure/migrations/005_tournament_reader.sql"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  tourn07-grep-gate:
    name: TOURN-07 grep gate (no parallel metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run grep gate (Phase 3 success criterion #5)
        run: |
          set -e
          MATCHES=$(grep -r --include='*.py' \
            "def directional_accuracy\|def sharpe\|def deflated" \
            services/tournament-harness/ | grep -v '/tests/' || true)
          if [ -n "$MATCHES" ]; then
            echo "TOURN-07 violation — parallel metric definitions found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "TOURN-07 grep gate clean."

  unit-tests:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    needs: tourn07-grep-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tournament-harness deps + ml-retraining for shared imports
        run: |
          pip install -r services/tournament-harness/requirements.txt
          pip install -r services/ml-retraining-service/requirements.txt || true
      - name: Run pytest (unit only)
        env:
          PYTHONPATH: services/tournament-harness:services/ml-retraining-service
        run: |
          cd services/tournament-harness
          pytest tests/unit/ -v --no-header

  integration-fake-docker:
    name: Integration (fake-docker pipeline)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r services/tournament-harness/requirements.txt
          pip install -r services/ml-retraining-service/requirements.txt || true
      - name: Run grep-gate + fake-docker integration tests
        env:
          PYTHONPATH: services/tournament-harness:services/ml-retraining-service
        run: |
          cd services/tournament-harness
          pytest tests/integration/test_tourn07_grep_gate.py -v
          pytest tests/integration/test_orchestrator_with_fake_docker.py -v

  integration-real-stack:
    name: Integration (real Docker stack - nightly only)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r services/tournament-harness/requirements.txt
          pip install -r services/ml-retraining-service/requirements.txt || true
          pip install -r tests/requirements.txt || true
      - name: Bring up stack (Phase 2 bootstrap_stack + tournament profile)
        env:
          DOCKER_BUILDKIT: 0
        run: |
          docker compose -f docker-compose.unified.yml --profile tournament up -d \
              timescaledb postgres redis rabbitmq tournament-harness
          sleep 30
      - name: Run real-stack end-to-end test
        env:
          PYTHONPATH: services/tournament-harness:services/ml-retraining-service
        run: |
          cd services/tournament-harness
          pytest tests/integration/test_end_to_end_tournament.py -v
      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.unified.yml --profile tournament down -v
