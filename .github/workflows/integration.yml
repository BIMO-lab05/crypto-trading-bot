name: Integration Suite (Phase 2)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: pytest tests/integration (deterministic, tape mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for `git diff origin/main..HEAD` in anti-mock guard

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pytest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/integration/requirements.txt

      - name: Install Playwright browsers (Chromium only, D-18)
        run: |
          # Phase 7 DASH-06 -- install Chromium for the audit-driven dashboard smoke.
          # Chromium only per CONTEXT.md D-18; Firefox/WebKit deferred to v2.
          playwright install --with-deps chromium

      - name: Boot stack via bootstrap.sh in tape mode
        env:
          MARKET_DATA_SOURCE: tape
          PAPER_TRADING_MODE: 'true'
          TRADING_MODE: PAPER
          AUTO_TRADING_ENABLED: 'true'
          ENABLE_ML_PREDICTIONS: 'false'
          ENABLE_SENTIMENT_ANALYSIS: 'false'
          NOTIFICATION_TEST_MODE: live
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
        run: |
          : > .env  # D-06 -- empty .env at bootstrap entry
          bash bootstrap.sh

      - name: Run integration suite
        env:
          MARKET_DATA_SOURCE: tape
          NOTIFICATION_TEST_MODE: live
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
        run: |
          # D-22: capture screenshot + video + trace on failure for the Playwright smoke
          # (pytest-playwright plugin flags; no-ops for non-Playwright tests in the suite).
          pytest tests/integration -v --tb=short --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure

      - name: Anti-mock guard (D-12)
        if: github.event_name == 'pull_request'
        run: |
          # Compare PR HEAD against main to enforce D-12 -- refuse mocks/skips/xfails/threshold-lowering inside tests/.
          # NOTE: gated to pull_request events. Direct pushes bypass this. Operator MUST
          # configure GitHub branch protection on main/master to require PRs (see plan
          # verification block).
          git fetch origin main
          git diff origin/main..HEAD -- 'tests/' | bash scripts/iter-fix-check-diff.sh

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.unified.yml logs > logs/integration-logs.txt 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: logs/integration-logs.txt
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          # D-22: pytest-playwright drops outputs in any of these locations depending on
          # plugin version + project layout. `if-no-files-found: ignore` keeps the step
          # green when the smoke didn't run (e.g. failure before reaching the smoke).
          path: |
            test-results/
            playwright-report/
            tests/integration/.playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.unified.yml down -v || true
