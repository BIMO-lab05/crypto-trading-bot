# Reusable Workflow - Deploy to Kubernetes
# Purpose: Reusable workflow for deploying to Kubernetes clusters
# Usage: Called from CD workflows with environment-specific parameters

name: Deploy to Kubernetes (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev/staging/prod)'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: true
        type: string
      image_tags:
        description: 'JSON map of service names to image tags'
        required: true
        type: string
      cluster_name:
        description: 'Kubernetes cluster name'
        required: false
        type: string
        default: 'default-cluster'
      deployment_strategy:
        description: 'Deployment strategy (rolling/blue-green/canary)'
        required: false
        type: string
        default: 'rolling'
      run_smoke_tests:
        description: 'Whether to run smoke tests after deployment'
        required: false
        type: boolean
        default: true
      rollback_on_failure:
        description: 'Whether to rollback on deployment failure'
        required: false
        type: boolean
        default: true

    outputs:
      deployment_status:
        description: 'Deployment status (success/failed)'
        value: ${{ jobs.deploy.outputs.status }}
      deployed_version:
        description: 'Deployed version'
        value: ${{ jobs.deploy.outputs.version }}

    secrets:
      kube_config:
        description: 'Base64 encoded kubeconfig'
        required: true
      api_secrets:
        description: 'JSON string of API secrets'
        required: false

jobs:
  # Job 1: Pre-deployment Validation
  pre-deployment:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.kube_config }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Validate image tags
        run: |
          echo "Validating image tags..."
          echo '${{ inputs.image_tags }}' | jq '.'

      - name: Check namespace exists
        run: |
          kubectl get namespace ${{ inputs.namespace }} || kubectl create namespace ${{ inputs.namespace }}

      - name: Verify resources availability
        run: |
          # Check if cluster has enough resources
          kubectl describe nodes | grep -A 5 "Allocated resources:" || true

  # Job 2: Deploy to Kubernetes
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [pre-deployment]
    timeout-minutes: 30

    outputs:
      status: ${{ steps.deployment_status.outputs.status }}
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.kube_config }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config use-context ${{ inputs.cluster_name }} || true

      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(echo '${{ inputs.image_tags }}' | jq -r 'to_entries | .[0].value' | cut -d':' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create namespace
        run: |
          kubectl create namespace ${{ inputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Backup current deployment
        if: ${{ inputs.environment == 'production' }}
        run: |
          mkdir -p backups
          kubectl get all -n ${{ inputs.namespace }} -o yaml > backups/backup-$(date +%Y%m%d-%H%M%S).yaml || true

      - name: Create ConfigMaps
        run: |
          kubectl apply -f infrastructure/kubernetes/configmaps/ -n ${{ inputs.namespace }} || true

      - name: Create Secrets
        run: |
          # Parse and create secrets from input
          if [ -n "${{ secrets.api_secrets }}" ]; then
            echo '${{ secrets.api_secrets }}' | jq -r 'to_entries | map("--from-literal=\(.key)=\(.value)") | join(" ")' > /tmp/secret_args

            kubectl create secret generic api-secrets \
              $(cat /tmp/secret_args) \
              --namespace ${{ inputs.namespace }} \
              --dry-run=client -o yaml | kubectl apply -f -

            rm /tmp/secret_args
          fi

      - name: Deploy databases (if needed)
        if: ${{ inputs.environment != 'production' }}
        run: |
          kubectl apply -f infrastructure/kubernetes/databases/ -n ${{ inputs.namespace }} || true

          # Wait for databases to be ready
          kubectl wait --for=condition=ready pod -l app=postgres -n ${{ inputs.namespace }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=redis -n ${{ inputs.namespace }} --timeout=120s || true

      - name: Update deployment image tags
        run: |
          # Parse image tags and update deployment files
          IMAGE_TAGS='${{ inputs.image_tags }}'

          # For each service in the image tags map
          echo "$IMAGE_TAGS" | jq -r 'to_entries | .[] | "\(.key) \(.value)"' | while read service image; do
            echo "Updating ${service} to ${image}"

            # Find deployment file
            DEPLOYMENT_FILE=""
            if [ -f "infrastructure/kubernetes/services/${service}-deployment.yaml" ]; then
              DEPLOYMENT_FILE="infrastructure/kubernetes/services/${service}-deployment.yaml"
            elif [ -f "infrastructure/kubernetes/${service}-deployment.yaml" ]; then
              DEPLOYMENT_FILE="infrastructure/kubernetes/${service}-deployment.yaml"
            fi

            if [ -n "$DEPLOYMENT_FILE" ]; then
              # Update image in deployment file
              sed -i "s|image:.*${service}:.*|image: ${image}|g" "$DEPLOYMENT_FILE"
            fi
          done

      - name: Deploy with Rolling Update strategy
        if: ${{ inputs.deployment_strategy == 'rolling' }}
        run: |
          # Apply deployments using kustomize if available
          if [ -f "infrastructure/kubernetes/kustomization/overlays/${{ inputs.environment }}/kustomization.yaml" ]; then
            kubectl apply -k infrastructure/kubernetes/kustomization/overlays/${{ inputs.environment }} -n ${{ inputs.namespace }}
          else
            # Fallback to direct apply
            kubectl apply -f infrastructure/kubernetes/services/ -n ${{ inputs.namespace }} || true
            kubectl apply -f infrastructure/kubernetes/*.yaml -n ${{ inputs.namespace }} || true
          fi

      - name: Deploy with Blue-Green strategy
        if: ${{ inputs.deployment_strategy == 'blue-green' }}
        run: |
          # Label current deployment as 'blue'
          kubectl label deployment -n ${{ inputs.namespace }} --all version=blue --overwrite || true

          # Deploy new version as 'green'
          kubectl apply -k infrastructure/kubernetes/kustomization/overlays/${{ inputs.environment }} -n ${{ inputs.namespace }}

          # Label new deployments as 'green'
          sleep 5
          kubectl label deployment -n ${{ inputs.namespace }} --all version=green --overwrite

      - name: Deploy with Canary strategy
        if: ${{ inputs.deployment_strategy == 'canary' }}
        run: |
          echo "::notice::Canary deployment strategy - deploying 10% traffic to new version"

          # Create canary deployment with reduced replicas
          # This would typically involve service mesh (Istio/Linkerd) configuration
          kubectl apply -k infrastructure/kubernetes/kustomization/overlays/${{ inputs.environment }} -n ${{ inputs.namespace }}

      - name: Wait for deployments to be ready
        run: |
          # Extract service names from image tags
          SERVICES=$(echo '${{ inputs.image_tags }}' | jq -r 'keys | .[]')

          for service in $SERVICES; do
            echo "Waiting for ${service} deployment..."
            kubectl rollout status deployment/${service} -n ${{ inputs.namespace }} --timeout=10m || {
              echo "::error::Deployment ${service} failed to rollout"
              exit 1
            }
          done

      - name: Verify pod health
        run: |
          # Wait for all pods to be running
          sleep 30

          TOTAL_PODS=$(kubectl get pods -n ${{ inputs.namespace }} --no-headers | wc -l)
          RUNNING_PODS=$(kubectl get pods -n ${{ inputs.namespace }} --field-selector=status.phase=Running --no-headers | wc -l)

          echo "Running pods: $RUNNING_PODS / $TOTAL_PODS"

          if [ "$RUNNING_PODS" -lt "$TOTAL_PODS" ]; then
            echo "::warning::Not all pods are running"
            kubectl get pods -n ${{ inputs.namespace }}
          fi

      - name: Apply HorizontalPodAutoscalers
        run: |
          kubectl apply -f infrastructure/kubernetes/autoscaling/ -n ${{ inputs.namespace }} || true

      - name: Apply Ingress rules
        run: |
          kubectl apply -f infrastructure/kubernetes/ingress/ -n ${{ inputs.namespace }} || true

      - name: Get deployment status
        id: deployment_status
        run: |
          # Check if all deployments are healthy
          FAILED_DEPLOYMENTS=$(kubectl get deployments -n ${{ inputs.namespace }} -o json | jq -r '.items[] | select(.status.availableReplicas != .status.replicas) | .metadata.name')

          if [ -z "$FAILED_DEPLOYMENTS" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Failed deployments: $FAILED_DEPLOYMENTS"
          fi

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## Deployment Summary: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ inputs.namespace }}" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** ${{ inputs.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Deployments" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n ${{ inputs.namespace }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ inputs.namespace }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: ${{ failure() && inputs.rollback_on_failure }}
        run: |
          echo "::error::Deployment failed! Rolling back..."

          # Rollback all deployments
          kubectl rollout undo deployment -n ${{ inputs.namespace }} --all || true

          # Wait for rollback to complete
          sleep 30

          # Restore from backup if available
          if [ -f backups/backup-*.yaml ]; then
            kubectl apply -f backups/backup-*.yaml || true
          fi

          echo "::notice::Rollback completed"

  # Job 3: Post-deployment Smoke Tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ inputs.run_smoke_tests && needs.deploy.outputs.status == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.kube_config }}" | base64 -d > $HOME/.kube/config

      - name: Wait for services to stabilize
        run: |
          sleep 30

      - name: Test API Gateway health
        run: |
          # Port-forward to API Gateway
          kubectl port-forward -n ${{ inputs.namespace }} service/api-gateway 8000:8000 &
          PF_PID=$!
          sleep 10

          # Test health endpoint
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")

          kill $PF_PID || true

          if [ "$HEALTH_STATUS" == "200" ]; then
            echo "::notice::Health check passed (status: $HEALTH_STATUS)"
          else
            echo "::error::Health check failed (status: $HEALTH_STATUS)"
            exit 1
          fi

      - name: Run smoke test suite
        run: |
          # Execute smoke tests inside API Gateway pod
          POD_NAME=$(kubectl get pod -n ${{ inputs.namespace }} -l app=api-gateway -o jsonpath='{.items[0].metadata.name}')

          if [ -n "$POD_NAME" ]; then
            kubectl exec -n ${{ inputs.namespace }} $POD_NAME -- pytest tests/smoke/ -v || true
          fi

      - name: Check service logs for errors
        if: always()
        run: |
          # Get logs from key services
          for service in api-gateway trading-engine portfolio-manager; do
            echo "=== Logs for ${service} ==="
            POD_NAME=$(kubectl get pod -n ${{ inputs.namespace }} -l app=${service} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

            if [ -n "$POD_NAME" ]; then
              kubectl logs -n ${{ inputs.namespace }} $POD_NAME --tail=100 || true
            fi
          done

  # Job 4: Deployment Notification
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()

    steps:
      - name: Determine notification message
        id: message
        run: |
          if [ "${{ needs.deploy.outputs.status }}" == "success" ] && [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Deployment to ${{ inputs.environment }} completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Deployment to ${{ inputs.environment }} failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate deployment report
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.message.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.deploy.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Tests:** ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
