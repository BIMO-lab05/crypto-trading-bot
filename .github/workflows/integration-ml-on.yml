name: Integration Suite — ML-on Variant (Phase 2 CD-05)

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC nightly
  workflow_dispatch:        # manual trigger

concurrency:
  group: integration-ml-on-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-ml-on:
    name: pytest tests/integration -m ml_on (ENABLE_ML_PREDICTIONS=true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx asyncpg pytest pytest-asyncio

      - name: Boot stack with ML enabled
        env:
          MARKET_DATA_SOURCE: tape
          PAPER_TRADING_MODE: 'true'
          TRADING_MODE: PAPER
          AUTO_TRADING_ENABLED: 'true'
          ENABLE_ML_PREDICTIONS: 'true'    # CD-05 -- variant flips this
          ENABLE_SENTIMENT_ANALYSIS: 'false'
          NOTIFICATION_TEST_MODE: live
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
        run: |
          : > .env
          bash bootstrap.sh

      - name: Run ML-on suite
        env:
          ENABLE_ML_PREDICTIONS: 'true'
          MARKET_DATA_SOURCE: tape
        run: |
          pytest tests/integration -m ml_on -v --tb=short

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.unified.yml logs > logs/ml-on-logs.txt 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-ml-on-logs
          path: logs/ml-on-logs.txt
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.unified.yml down -v || true
