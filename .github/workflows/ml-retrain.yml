name: ml-retrain

# Replaces the in-cluster ml-retraining-service APScheduler job
# (services/ml-retraining-service/app/core/scheduler.py:49 — Mon 02:00 UTC).
# In the headless deploy the always-on container is dropped; GH Actions
# triggers a one-shot retrain on the deploy host instead.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Run one-shot retrain on Oracle VM
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" bash -lc '
            set -euo pipefail
            cd ~/bot
            docker compose -f docker-compose.headless.yml \
              run --rm --build \
                ml-retraining \
                python -m app.main --once
          '

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
