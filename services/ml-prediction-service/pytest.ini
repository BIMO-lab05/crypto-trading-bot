[pytest]
# Pytest configuration for ML Prediction Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

# Markers for different test types
markers =
    integration: Integration tests (may be slower)
    performance: Performance tests
    slow: Slow tests
    unit: Unit tests (fast, isolated)

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
