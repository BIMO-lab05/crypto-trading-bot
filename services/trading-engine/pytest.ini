[pytest]
# Pytest configuration for Statistical Arbitrage tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    -v
    -ra
    -l
    --strict-markers
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    -p no:warnings

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    stat_arb: Tests for Statistical Arbitrage functionality
    validation: Tests for Pydantic model validation
    grid_trading: Tests for Grid Trading strategy
    slow: Tests that take >1 second
    api: Tests that require API server
