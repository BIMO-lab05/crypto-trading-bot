[pytest]
# Pytest configuration for Risk & Metrics Service tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Show test output
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    --asyncio-mode=auto

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for API endpoints
    slow: Tests that take longer to run
    auth: Tests related to authentication
    risk: Tests related to risk calculations
    performance: Tests related to performance metrics
    circuit_breaker: Tests for circuit breaker functionality
    state_machine: Tests for circuit breaker state machine logic
    models: Tests for data models
    main: Tests for main application
    backtesting: Tests for backtesting engine

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    # Exclude backtesting module from coverage (future enhancement)
    app/backtesting.py
    app/backtest_models.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
