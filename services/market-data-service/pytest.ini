# Pytest Configuration for Market Data Service

[pytest]
minversion = 7.0

python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts = 
    -v
    -ra
    --showlocals
    --strict-markers
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running
    database: mark test as requiring database

asyncio_mode = auto

[coverage:run]
source = app
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
