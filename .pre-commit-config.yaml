# Pre-commit hooks configuration for Crypto Trading Bot
# Version: 1.0.0
# Last Updated: 2025-11-14
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   pre-commit run --all-files  # Run on all files
#   pre-commit run <hook-id>    # Run specific hook
#   pre-commit autoupdate       # Update hooks to latest versions

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent committing to main/master
      - id: no-commit-to-branch
        name: Prevent commits to main/master
        args: ['--branch', 'main', '--branch', 'master']

      # File size limits
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
        exclude: |
          (?x)^(
            .*\.sql\.gz|
            .*\.tar\.gz|
            .*\.zip|
            .*\.png|
            .*\.jpg|
            .*\.jpeg
          )$

      # YAML validation
      - id: check-yaml
        name: Validate YAML files
        args: ['--allow-multiple-documents']
        exclude: ^\.gitlab-ci\.yml$

      # JSON validation
      - id: check-json
        name: Validate JSON files

      # Trailing whitespace
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: ['--markdown-linebreak-ext=md']

      # End of file fixer
      - id: end-of-file-fixer
        name: Ensure files end with newline

      # Mixed line endings
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

      # Merge conflict markers
      - id: check-merge-conflict
        name: Check for merge conflict markers

      # Case conflicts
      - id: check-case-conflict
        name: Check for case conflicts

      # Symlink check
      - id: check-symlinks
        name: Check for broken symlinks

      # Python-specific
      - id: check-ast
        name: Validate Python AST

      - id: check-builtin-literals
        name: Check for builtin type constructors

      - id: check-docstring-first
        name: Check docstring placement

      - id: debug-statements
        name: Check for debug statements

      - id: name-tests-test
        name: Check test naming
        args: ['--pytest-test-first']

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.env\.example|
            .*\.md|
            package-lock\.json|
            poetry\.lock
          )$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Shellcheck
        args: ['--severity=warning']

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3.12
        args: ['--line-length=100']

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ['--profile', 'black', '--line-length', '100']

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python with flake8
        args: [
          '--max-line-length=100',
          '--extend-ignore=E203,W503',  # Conflicts with Black
          '--max-complexity=10'
        ]
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions

  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args: [
          '--ignore-missing-imports',
          '--no-strict-optional',
          '--warn-redundant-casts',
          '--warn-unused-ignores'
        ]
        additional_dependencies:
          - types-requests
          - types-redis
        exclude: ^tests/

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security check with bandit
        args: ['-r', 'services/', '-ll', '-x', '**/tests/**']
        exclude: ^tests/

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles

  # Markdown linting
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--config', '.markdownlint.json']

  # Docker Compose validation
  - repo: local
    hooks:
      - id: docker-compose-check
        name: Validate docker-compose.unified.yml
        entry: docker-compose
        args: ['-f', 'docker-compose.unified.yml', 'config', '--quiet']
        language: system
        files: ^docker-compose.*\.yml$
        pass_filenames: false

  # Configuration validation
  - repo: local
    hooks:
      - id: validate-config
        name: Validate system configuration
        entry: bash
        # pre-commit runs from the repo root; relative path works on any
        # machine. Was hardcoded to /mnt/d/Bimo_max/... — broken for every
        # contributor not on the original WSL setup.
        args: ['-c', './scripts/validate_configuration.sh']
        language: system
        pass_filenames: false
        stages: [manual]

  # Risk limits validation
  - repo: local
    hooks:
      - id: validate-risk-limits
        name: Validate risk management limits
        entry: python3
        args: ['scripts/validate_risk_limits.py', '--verbose']
        language: system
        pass_filenames: false
        stages: [manual]

  # API key security check
  - repo: local
    hooks:
      - id: check-api-keys
        name: Check for exposed API keys
        entry: bash
        args:
          - -c
          - |
            if grep -r "BYBIT_API_KEY=.*[a-zA-Z0-9]" services/ --exclude-dir=node_modules --exclude="*.example" --exclude="*.md"; then
              echo "ERROR: Found exposed API keys in code"
              exit 1
            fi
            if grep -r "TELEGRAM_BOT_TOKEN=.*[a-zA-Z0-9]" services/ --exclude-dir=node_modules --exclude="*.example" --exclude="*.md"; then
              echo "ERROR: Found exposed Telegram tokens in code"
              exit 1
            fi
        language: system
        pass_filenames: false

  # Environment file check
  - repo: local
    hooks:
      - id: check-env-files
        name: Ensure .env files are not committed
        entry: bash
        args:
          - -c
          - |
            if git diff --cached --name-only | grep -E "\.env$" | grep -v "\.env\.example"; then
              echo "ERROR: .env files should not be committed"
              echo "Use .env.example instead"
              exit 1
            fi
        language: system
        pass_filenames: false

  # Script permissions check
  - repo: local
    hooks:
      - id: check-script-permissions
        name: Ensure scripts are executable
        entry: bash
        args:
          - -c
          - |
            find scripts -name "*.sh" -type f ! -executable -print | while read file; do
              echo "Making $file executable"
              chmod +x "$file"
            done
        language: system
        pass_filenames: false

# Configuration for specific stages
default_stages: [commit, push]

# Exclude patterns globally
exclude: |
  (?x)^(
    .*\.min\.js|
    .*\.min\.css|
    node_modules/.*|
    venv/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.mypy_cache/.*|
    \.git/.*|
    dist/.*|
    build/.*|
    \.eggs/.*|
    .*\.egg-info/.*
  )$

# Minimum supported version
minimum_pre_commit_version: "2.20.0"
