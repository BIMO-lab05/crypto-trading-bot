# =============================================================================
# CRYPTO TRADING BOT - UNIFIED DOCKER COMPOSE
# =============================================================================
# This file contains ALL services for the crypto trading bot system:
# - Infrastructure (databases, cache, message broker)
# - Application services (microservices)
# - Monitoring (Prometheus, Grafana)
# - Frontend
#
# Usage:
#   Development:  docker-compose -f docker-compose.unified.yml up -d
#   Production:   docker-compose -f docker-compose.unified.yml --profile production up -d
#   With monitoring: docker-compose -f docker-compose.unified.yml --profile monitoring up -d
#
# Author: Infrastructure Team
# Last Updated: 2025-11-29
# =============================================================================

version: '3.8'

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # INFRASTRUCTURE SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # PostgreSQL - Main application database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: crypto-bot-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptobot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cryptobot}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infrastructure/migrations/003_portfolios_orm_align.sql:/docker-entrypoint-initdb.d/03-portfolios-orm-align.sql:ro
      - ./infrastructure/migrations/004_positions_orm_align.sql:/docker-entrypoint-initdb.d/04-positions-orm-align.sql:ro
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptobot} -d ${POSTGRES_DB:-cryptobot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # TimescaleDB - Time-series database for market data
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: crypto-bot-timescaledb
    hostname: timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-cryptobot}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-timescale_dev_password}
      POSTGRES_DB: ${TIMESCALE_DB:-market_data}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-timescale.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-cryptobot} -d ${TIMESCALE_DB:-market_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis - Caching and session storage
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: crypto-bot-redis
    hostname: redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # RabbitMQ - Message broker for inter-service communication
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: crypto-bot-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cryptobot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cryptobot}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ===========================================================================
  # MONITORING SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-bot-prometheus
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - crypto-bot-network
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Grafana - Metrics visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: crypto-bot-grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - crypto-bot-network
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # APPLICATION SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # API Gateway - Entry point for all requests
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: crypto-bot-api-gateway
    hostname: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Database connections
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-cryptobot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cryptobot_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-cryptobot}
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      # Service URLs
      - BYBIT_CONNECTOR_URL=http://bybit-connector:8001
      - MARKET_DATA_URL=http://market-data:8002
      - PORTFOLIO_MANAGER_URL=http://portfolio-manager:8003
      - TECHNICAL_ANALYSIS_URL=http://technical-analysis:8004
      - TRADING_ENGINE_URL=http://trading-engine:8005
      - NOTIFICATION_URL=http://notification-service:8006
      - ML_PREDICTION_URL=http://ml-prediction:8007
      - SENTIMENT_ANALYSIS_URL=http://sentiment-analysis:8008
      - RISK_METRICS_URL=http://risk-metrics:8009
      # Emergency stop file — admin endpoint writes here, trading-engine reads
      # via the shared safety/ dir bind-mount. Dir-to-dir mount avoids the
      # Docker auto-create-dir gotcha that file-to-file binds suffer when the
      # host file is missing at compose-up. File presence inside the dir is
      # the toggle: absent=run, present=halt. Operator toggles via
      # `touch safety/EMERGENCY_STOP` / `rm safety/EMERGENCY_STOP` on host.
      - EMERGENCY_STOP_FILE=${EMERGENCY_STOP_FILE:-/app/safety/EMERGENCY_STOP}
      # Trading-mode flags — read by /api/config/safety-state (DASH-03 / Plan 06-02).
      # Defaults match CLAUDE.md project rules: TRADING_MODE starts at PAPER, the
      # four deliberate steps to LIVE require explicit env override.
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - PAPER_TRADING_MODE=${PAPER_TRADING_MODE:-true}
      - ENABLE_ML_PREDICTIONS=${ENABLE_ML_PREDICTIONS:-false}
      - ENABLE_SENTIMENT_ANALYSIS=${ENABLE_SENTIMENT_ANALYSIS:-false}
      # Plan 07.1-01 BUG-3: catch-all reverse-proxy target. api-gateway
      # forwards non-/api GET requests (including `/`) to the frontend
      # nginx container so http://localhost:8000 (gateway origin) can
      # serve the React SPA. NOTE: we deliberately do NOT add
      # `frontend` to api-gateway's `depends_on` because the frontend
      # block already declares `depends_on: api-gateway: service_healthy`
      # — adding the reverse edge would create a circular dependency
      # that docker-compose refuses to resolve. The catch-all tolerates
      # a brief 502 window while frontend boots (returns Bad Gateway,
      # no startup blocker on api-gateway itself).
      - FRONTEND_UPSTREAM=${FRONTEND_UPSTREAM:-http://frontend:80}
      # Phase 10 DASHLIVE-02 — state file path + 24h continuous-PASS window env vars.
      # PREFLIGHT_CARRY_INS_PATH defaults to /app/planning_state/carry_ins.json (inside
      # the RW bind-mount declared in volumes below). Override to /tmp/carry_ins.json
      # in unit tests; use PREFLIGHT_CONTINUOUS_PASS_REQUIRED_SECONDS=1 in CI.
      - PREFLIGHT_CARRY_INS_PATH=${PREFLIGHT_CARRY_INS_PATH:-/app/planning_state/carry_ins.json}
      - PREFLIGHT_CONTINUOUS_PASS_REQUIRED_SECONDS=${PREFLIGHT_CONTINUOUS_PASS_REQUIRED_SECONDS:-86400}
    volumes:
      - ./services/api-gateway/logs:/app/logs
      # RW dir-to-dir mount: gateway writes /app/safety/EMERGENCY_STOP via
      # POST /api/portfolio/emergency-stop. trading-engine reads same dir RO.
      # Dir-to-dir avoids Docker's auto-create-dir-on-missing-file gotcha.
      - ./safety:/app/safety
      # Phase 7 D-01: RO bind-mount of committed tournament snapshots.
      # Gateway reads /app/snapshots/*.json for /api/tournament/snapshots[/{id}].
      # tournament-harness service writes here under profile=tournament; gateway
      # never writes. RO ensures the gateway can't corrupt the committed artifact.
      - ./services/tournament-harness/data/snapshots:/app/snapshots:ro
      # Phase 10 DASHLIVE-02 — RW bind-mount for carry_ins.json state file.
      # Gateway writes _state.first_all_pass_at on each 5s poll cycle.
      # Mount the PARENT DIRECTORY (./.planning/state), NOT the single file —
      # see CLAUDE.md WSL bind-mount-race gotcha (docker silently creates an
      # empty dir at single-file mount points on WSL2). Container path
      # /app/planning_state/carry_ins.json is the default of
      # PREFLIGHT_CARRY_INS_PATH (overridable for tests).
      - ./.planning/state:/app/planning_state:rw
    networks:
      - crypto-bot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Frontend - React dashboard
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-bot-frontend
    hostname: frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - REACT_APP_API_URL=http://localhost:${API_GATEWAY_PORT:-8000}
    networks:
      - crypto-bot-network
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Bybit Connector - Exchange API integration
  # ---------------------------------------------------------------------------
  bybit-connector:
    build:
      context: ./services/bybit-connector
      dockerfile: Dockerfile
    container_name: crypto-bot-bybit
    hostname: bybit-connector
    ports:
      # SEC-0: loopback-only. This service holds live mainnet credentials and
      # exposes POST /api/v1/order/place with no authentication; published on
      # 0.0.0.0 it was reachable from the LAN. Nothing outside this host needs
      # it -- only api-gateway (8000) and the frontend (3000) face outward.
      - "127.0.0.1:${BYBIT_PORT:-8001}:8001"
    environment:
      - SERVICE_NAME=bybit-connector
      - SERVICE_PORT=8001
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BYBIT_API_KEY=${BYBIT_API_KEY:-}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET:-}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      # SEC-0 order-placement guard. Defaults are the SAFE values: the
      # connector refuses to touch the exchange unless all three are set for
      # live trading, mirroring the trading-engine contract.
      - PAPER_TRADING_MODE=${PAPER_TRADING_MODE:-true}
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - LIVE_TRADING_ACK=${LIVE_TRADING_ACK:-}
      # Default 'live' — real Bybit REST/WS. Set MARKET_DATA_SOURCE=tape in .env
      # only when replaying tests/fixtures/tape/*.jsonl (integration tests, replay
      # debugging). Tape fixtures freeze prices and silently diverge from real
      # market — flagged 2026-05-21 after BTC cache stuck at 81,270 vs mainnet 77,200.
      - MARKET_DATA_SOURCE=${MARKET_DATA_SOURCE:-live}
      - TAPE_FIXTURES_PATH=/app/tests/fixtures/tape
    volumes:
      - ./services/bybit-connector/logs:/app/logs
      # Tape fixtures for MARKET_DATA_SOURCE=tape mode (D-15). Read-only — never mutated by the connector.
      - ./tests/fixtures/tape:/app/tests/fixtures/tape:ro
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Market Data Service - Real-time market data collection
  # ---------------------------------------------------------------------------
  market-data:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: crypto-bot-market-data
    hostname: market-data
    ports:
      - "${MARKET_DATA_PORT:-8002}:8002"
    environment:
      - SERVICE_NAME=market-data-service
      - SERVICE_PORT=8002
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=${TIMESCALE_USER:-cryptobot}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-timescale_dev_password}
      - TIMESCALE_DB=${TIMESCALE_DB:-market_data}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - BYBIT_CONNECTOR_URL=http://bybit-connector:8001
    volumes:
      - ./services/market-data-service/logs:/app/logs
    networks:
      - crypto-bot-network
    depends_on:
      timescaledb:
        condition: service_healthy
      bybit-connector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Portfolio Manager - Balance and position tracking
  # ---------------------------------------------------------------------------
  portfolio-manager:
    build:
      context: ./services/portfolio-manager
      dockerfile: Dockerfile
    container_name: crypto-bot-portfolio
    hostname: portfolio-manager
    ports:
      # SEC-1: loopback-only. This service has no authentication on any route,
      # including /api/v1/transaction/buy and /sell.
      - "127.0.0.1:${PORTFOLIO_PORT:-8003}:8003"
    environment:
      - SERVICE_NAME=portfolio-manager
      - SERVICE_PORT=8003
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_DATABASE=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot_dev_password}@postgres:5432/${POSTGRES_DB:-cryptobot}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-cryptobot}
      - DB_USER=${POSTGRES_USER:-cryptobot}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-cryptobot_dev_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - BYBIT_CONNECTOR_URL=http://bybit-connector:8001
      # Without these two, portfolio-manager falls back to localhost:8005/8002
      # defaults from app/config.py and chronically fails its 60s sync poll.
      - TRADING_ENGINE_URL=http://trading-engine:8005
      - MARKET_DATA_URL=http://market-data:8002
    volumes:
      - ./services/portfolio-manager/logs:/app/logs
    networks:
      - crypto-bot-network
    depends_on:
      postgres:
        condition: service_healthy
      bybit-connector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Technical Analysis - Trading indicators
  # ---------------------------------------------------------------------------
  technical-analysis:
    build:
      context: ./services/technical-analysis
      dockerfile: Dockerfile
    container_name: crypto-bot-ta
    hostname: technical-analysis
    ports:
      - "${TA_PORT:-8004}:8004"
    environment:
      - SERVICE_NAME=technical-analysis
      - SERVICE_PORT=8004
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - BYBIT_CONNECTOR_URL=http://bybit-connector:8001
      - MARKET_DATA_URL=http://market-data:8002
    volumes:
      - ./services/technical-analysis/logs:/app/logs
    networks:
      - crypto-bot-network
    depends_on:
      bybit-connector:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Trading Engine - Core trading logic
  # ---------------------------------------------------------------------------
  trading-engine:
    build:
      context: ./services/trading-engine
      dockerfile: Dockerfile
    container_name: crypto-bot-trading
    hostname: trading-engine
    ports:
      # SEC-1: loopback-only. 51 mutating routes, zero auth schemes -- verified
      # against the live OpenAPI document. Every api-gateway guard was
      # advisory while this was reachable from the LAN.
      - "127.0.0.1:${TRADING_PORT:-8005}:8005"
    environment:
      - SERVICE_NAME=trading-engine
      - SERVICE_PORT=8005
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      # Risk management
      # 2026-05-06: bumped default 0.02 → 0.10 to align with $100 paper balance × 10%/trade target.
      # service-local .env was being overridden by this compose-level block.
      - MAX_RISK_PER_TRADE=${MAX_RISK_PER_TRADE:-0.10}
      - MAX_POSITION_SIZE_PCT=${MAX_POSITION_SIZE_PCT:-10.0}
      - EMERGENCY_STOP_LOSS=${EMERGENCY_STOP_LOSS:-0.05}
      # File path inside the shared safety/ dir (see api-gateway block for context).
      - EMERGENCY_STOP_FILE=${EMERGENCY_STOP_FILE:-/app/safety/EMERGENCY_STOP}
      - PAPER_TRADING_MODE=${PAPER_TRADING_MODE:-true}
      - PAPER_INITIAL_BALANCE=100.0
      # Strategy mode: ensemble = SimpleRSI + multi-indicator + mean-reversion (performance-weighted)
      - STRATEGY_MODE=${STRATEGY_MODE:-ensemble}
      # Database — POSTGRES_* is the single source of truth now that
      # connection.py reads it instead of DB_* (audit 2026-04-27).
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cryptobot}
      - POSTGRES_USER=${POSTGRES_USER:-cryptobot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cryptobot_dev_password}
      # Service URLs
      - BYBIT_CONNECTOR_URL=http://bybit-connector:8001
      - MARKET_DATA_URL=http://market-data:8002
      - PORTFOLIO_MANAGER_URL=http://portfolio-manager:8003
      - TECHNICAL_ANALYSIS_URL=http://technical-analysis:8004
      - ML_PREDICTION_URL=http://ml-prediction:8007
      - SENTIMENT_ANALYSIS_URL=http://sentiment-analysis:8008
      # Notification client URL (was missing — code defaulted to localhost:8006 which fails inside docker)
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
      # Disabled by default: ml-prediction is gated behind --profile ml and
      # sentiment-analysis behind --profile analytics. Setting true while those
      # services are down causes the aggregator to log degradation messages on
      # every signal eval (graceful but noisy). Flip to true if those profiles
      # are activated. (2026-05-02)
      - ENABLE_ML_PREDICTIONS=${ENABLE_ML_PREDICTIONS:-false}
      - ENABLE_SENTIMENT_ANALYSIS=${ENABLE_SENTIMENT_ANALYSIS:-false}
      # Auto-trader on-by-default 2026-05-06. Boots whenever stack starts and
      # EMERGENCY_STOP file is absent at repo root. To disable: set
      # AUTO_TRADING_ENABLED=false in .env or `touch EMERGENCY_STOP` (file
      # present = halt). PAPER_TRADING_MODE=true ensures orders simulated.
      - AUTO_TRADING_ENABLED=${AUTO_TRADING_ENABLED:-true}
      # Leverage configuration (2026-05-09): 10x default, paper-trading only.
      # Effective notional per trade = MAX_RISK_PER_TRADE × balance × DEFAULT_LEVERAGE.
      # At 10% × $100 × 10x = $100 notional — clears Bybit min-notional comfortably.
      # WARNING: must drop DEFAULT_LEVERAGE back to 1.0 before flipping to LIVE.
      - LEVERAGE_ENABLED=${LEVERAGE_ENABLED:-true}
      - DEFAULT_LEVERAGE=${DEFAULT_LEVERAGE:-10.0}
      - MAX_LEVERAGE=${MAX_LEVERAGE:-20.0}
      - MIN_LEVERAGE=${MIN_LEVERAGE:-1.0}
    volumes:
      - ./services/trading-engine/logs:/app/logs
      # RO dir-to-dir mount of shared safety/ directory. The kill-switch
      # file path is /app/safety/EMERGENCY_STOP (see EMERGENCY_STOP_FILE env).
      # Dir-to-dir mount is intentional: file-to-file binds break silently when
      # the host file is missing (Docker auto-creates a dir at the mount point).
      # Operator: `touch safety/EMERGENCY_STOP` to halt, `rm` to resume.
      - ./safety:/app/safety:ro
    networks:
      - crypto-bot-network
    depends_on:
      postgres:
        condition: service_healthy
      bybit-connector:
        condition: service_healthy
      technical-analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Notification Service - Alerts and notifications
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: crypto-bot-notification
    hostname: notification-service
    ports:
      - "${NOTIFICATION_PORT:-8006}:8006"
    env_file:
      # Real Telegram/Slack/SMTP creds live here (gitignored).
      # env_file is loaded first; the `environment:` block below can override.
      - ./services/notification-service/.env
    environment:
      - SERVICE_NAME=notification-service
      - SERVICE_PORT=8006
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      # CD-01 / Plan 02-05 — Phase 2 notification test mode passthrough.
      # Without these explicit `${VAR:-}` lines, env from workspace-level .env or
      # CI `env:` blocks never reaches the container process; record mode never engages
      # and Plan 02-04's notification assertion fails. The env_file above points at
      # services/notification-service/.env (gitignored host-only) which cannot carry
      # per-test variables. (Blocker #1, revision 2.)
      # FIX 2026-07-29: default to REAL delivery ("" = production POST path).
      # The previous default was "record" (WR-05, for integration tests) which
      # silently wrote every notification to tests/.notifications.log INSIDE
      # the container while reporting telegram_sent=true — the operator never
      # received a single Telegram message and nothing looked wrong. Test-mode
      # must be opt-in, not the default: export NOTIFICATION_TEST_MODE=record
      # when running `pytest tests/integration` (the host conftest also sets
      # it), and leave it unset for normal operation.
      - NOTIFICATION_TEST_MODE=${NOTIFICATION_TEST_MODE:-}
      - NOTIFICATION_RECORD_PATH=${NOTIFICATION_RECORD_PATH:-tests/.notifications.log}
      - TEST_TELEGRAM_BOT_TOKEN=${TEST_TELEGRAM_BOT_TOKEN:-}
      - TEST_TELEGRAM_CHAT_ID=${TEST_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./services/notification-service/logs:/app/logs
      - ./services/notification-service/data:/app/data
      # CD-01 — record-mode writes through to host so the host pytest fixture can read
      # tests/.notifications.log. RW because the fixture also truncates between tests.
      - ./tests:/app/tests:rw
    networks:
      - crypto-bot-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # ML Prediction Service - LSTM price forecasting
  # ---------------------------------------------------------------------------
  ml-prediction:
    build:
      context: ./services/ml-prediction-service
      dockerfile: Dockerfile
    container_name: crypto-bot-ml-prediction
    hostname: ml-prediction
    ports:
      - "${ML_PORT:-8007}:8007"
    environment:
      - SERVICE_NAME=ml-prediction-service
      - SERVICE_PORT=8007
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MARKET_DATA_URL=http://market-data:8002
      - MODEL_DIR=/app/models
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      - BYBIT_API_KEY=${BYBIT_API_KEY:-}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET:-}
    volumes:
      - ./services/ml-prediction-service/logs:/app/logs
      - ./services/ml-prediction-service/models:/app/models
    networks:
      - crypto-bot-network
    depends_on:
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Opt-in profile so a RAM-constrained WSL host can run the core
    # trading flow without ml-prediction. Bring up with
    # `docker compose --profile ml up -d` when ML signals are needed.
    # trading-engine depends_on does NOT include ml-prediction, so the
    # core stack starts cleanly without it; runtime fan-out calls to
    # ml-prediction return connection-refused and the aggregator
    # downgrades to non-ML signals.
    profiles:
      - ml
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Was 6G — fictional on this stack since WSL caps RAM well
          # below that. Inference is bounded by the loaded GRU models
          # (~150 MB each, 5 active) plus FastAPI/TF runtime overhead.
          # 2G covers steady state + headroom; raise if loading more
          # models concurrently.
          memory: 2G

  # ---------------------------------------------------------------------------
  # Tournament Harness - Docker-isolated ML candidate evaluation (Phase 3)
  # Profile: opt-in only. Default `bootstrap.sh up` does not start it (D-01).
  # Bring up with:
  #   docker compose -f docker-compose.unified.yml --profile tournament up tournament-harness
  #
  # PRIVILEGE BOUNDARY: This container bind-mounts /var/run/docker.sock so the
  # orchestrator can launch experiment containers via the Docker SDK (D-02).
  # That is effectively root on the host. Mitigations: (a) profile-gated above,
  # (b) single-image runner pattern (D-05) — orchestrator only launches
  # crypto-bot-tournament-harness:latest, never user-supplied images.
  # ---------------------------------------------------------------------------
  tournament-harness:
    build:
      context: .
      dockerfile: services/tournament-harness/Dockerfile
    container_name: crypto-bot-tournament-harness
    hostname: tournament-harness
    ports:
      - "${TOURNAMENT_PORT:-8010}:8010"
    environment:
      - SERVICE_NAME=tournament-harness
      - SERVICE_PORT=8010
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=${TIMESCALE_DB:-market_data}
      - TIMESCALE_USER=tournament_reader
      - TIMESCALE_PASSWORD=${TOURNAMENT_READER_PASSWORD:-}
      - DOCKER_NETWORK=crypto-bot-network
      - RUNNER_IMAGE=crypto-bot-tournament-harness:latest
    volumes:
      - ./services/tournament-harness/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - crypto-bot-network
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    profiles:
      - tournament
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ---------------------------------------------------------------------------
  # Sentiment Analysis Service - News and social sentiment
  # ---------------------------------------------------------------------------
  sentiment-analysis:
    build:
      context: ./services/sentiment-analysis-service
      dockerfile: Dockerfile
    container_name: crypto-bot-sentiment
    hostname: sentiment-analysis
    ports:
      - "${SENTIMENT_PORT:-8008}:8008"
    environment:
      - SERVICE_NAME=sentiment-analysis-service
      - SERVICE_PORT=8008
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - SKIP_ML_MODEL=${SKIP_ML_MODEL:-false}
    volumes:
      - ./services/sentiment-analysis-service/logs:/app/logs
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Opt-in profile (analytics) — same rationale as ml-prediction.
    # No service depends_on sentiment-analysis; bringing it up is a
    # superset operation. `docker compose --profile analytics up -d`
    # to enable.
    profiles:
      - analytics
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ---------------------------------------------------------------------------
  # Risk Metrics Service - Risk analysis and metrics
  # ---------------------------------------------------------------------------
  risk-metrics:
    build:
      context: ./services/risk-metrics-service
      dockerfile: Dockerfile
    container_name: crypto-bot-risk-metrics
    hostname: risk-metrics
    ports:
      - "${RISK_PORT:-8009}:8009"
    environment:
      - SERVICE_NAME=risk-metrics-service
      - SERVICE_PORT=8009
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - TRADING_ENGINE_URL=http://trading-engine:8005
      - PORTFOLIO_MANAGER_URL=http://portfolio-manager:8003
    volumes:
      - ./services/risk-metrics-service/logs:/app/logs
    networks:
      - crypto-bot-network
    depends_on:
      trading-engine:
        condition: service_healthy
      portfolio-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  crypto-bot-network:
    name: crypto-bot-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # Infrastructure volumes
  postgres_data:
    name: crypto-bot-postgres-data
  timescaledb_data:
    name: crypto-bot-timescaledb-data
  redis_data:
    name: crypto-bot-redis-data
  rabbitmq_data:
    name: crypto-bot-rabbitmq-data
  # Monitoring volumes
  prometheus_data:
    name: crypto-bot-prometheus-data
  grafana_data:
    name: crypto-bot-grafana-data
