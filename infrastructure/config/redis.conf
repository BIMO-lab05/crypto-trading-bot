# Redis Configuration for Production-Ready Setup
# Rock-solid foundation with dual persistence (RDB + AOF)

# ====================
# NETWORK & SECURITY
# ====================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ====================
# GENERAL SETTINGS
# ====================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ====================
# RDB PERSISTENCE (Snapshotting)
# ====================
# Save the DB to disk:
# save <seconds> <changes>
# Save if at least 1 key changed in 900 seconds (15 minutes)
save 900 1
# Save if at least 10 keys changed in 300 seconds (5 minutes)
save 300 10
# Save if at least 10000 keys changed in 60 seconds (1 minute)
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ====================
# AOF PERSISTENCE (Append-Only File)
# ====================
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy:
# - always: fsync every write (slowest, safest)
# - everysec: fsync once per second (good balance)
# - no: let OS decide when to fsync (fastest, least safe)
appendfsync everysec

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

aof-load-truncated yes
aof-use-rdb-preamble yes

# ====================
# REPLICATION
# ====================
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# ====================
# MEMORY MANAGEMENT
# ====================
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ====================
# LAZY FREEING
# ====================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ====================
# SLOW LOG
# ====================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ====================
# EVENT NOTIFICATION
# ====================
notify-keyspace-events ""

# ====================
# ADVANCED CONFIG
# ====================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# ====================
# ACTIVE REHASHING
# ====================
activerehashing yes

# ====================
# CLIENT OUTPUT BUFFER LIMITS
# ====================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ====================
# FREQUENCY
# ====================
hz 10

# ====================
# AOF REWRITE
# ====================
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ====================
# LFU (Least Frequently Used) TUNING
# ====================
lfu-log-factor 10
lfu-decay-time 1

# ====================
# THREADED I/O
# ====================
# io-threads 4
# io-threads-do-reads yes
