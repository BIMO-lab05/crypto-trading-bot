# PostgreSQL Configuration for Production-Ready Setup
# Rock-solid foundation with WAL, performance tuning, and reliability

# ====================
# CONNECTION SETTINGS
# ====================
listen_addresses = '*'                 # Listen on all network interfaces (required for Docker networking)
max_connections = 200                   # Maximum number of concurrent connections
shared_buffers = 256MB                  # Shared memory for caching (25% of RAM recommended)
effective_cache_size = 1GB             # OS + PostgreSQL cache size estimate

# ====================
# WRITE-AHEAD LOG (WAL)
# ====================
wal_level = replica                     # Enable replication support
fsync = on                             # Force synchronous commit to disk (CRITICAL FOR DATA SAFETY)
synchronous_commit = on                # Wait for WAL to be written to disk
wal_sync_method = fdatasync            # Method for writing WAL
full_page_writes = on                  # Write full pages to WAL (protects against partial writes)
wal_compression = on                   # Compress WAL data
wal_buffers = 16MB                     # Buffer size for WAL data
wal_writer_delay = 200ms               # WAL writer sleep time

# WAL Archiving for Point-in-Time Recovery
archive_mode = on                      # Enable WAL archiving
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300                  # Force WAL file rotation every 5 minutes

# ====================
# REPLICATION SETTINGS
# ====================
max_wal_senders = 3                    # Maximum number of WAL sender processes
wal_keep_size = 1GB                    # Amount of WAL to retain for replication
hot_standby = on                       # Allow queries on standby servers

# ====================
# QUERY TUNING
# ====================
work_mem = 16MB                        # Memory for sort/hash operations per query
maintenance_work_mem = 128MB           # Memory for maintenance operations (VACUUM, CREATE INDEX)
random_page_cost = 1.1                 # Cost of random page access (lower for SSD)
effective_io_concurrency = 200         # Number of concurrent I/O operations (SSD optimized)

# ====================
# VACUUM & AUTOVACUUM
# ====================
autovacuum = on                        # Enable automatic vacuum
autovacuum_max_workers = 3             # Number of autovacuum worker processes
autovacuum_naptime = 1min              # Time between autovacuum runs
autovacuum_vacuum_threshold = 50       # Minimum number of tuple updates before vacuum
autovacuum_analyze_threshold = 50      # Minimum number of tuple inserts/updates/deletes before analyze
autovacuum_vacuum_scale_factor = 0.1   # Fraction of table size before vacuum
autovacuum_analyze_scale_factor = 0.05 # Fraction of table size before analyze

# ====================
# LOGGING
# ====================
logging_collector = on                 # Enable log file collection
log_directory = 'pg_log'              # Directory for log files
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d                 # Rotate log files daily
log_rotation_size = 100MB             # Rotate when file reaches 100MB
log_min_duration_statement = 1000     # Log queries taking longer than 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = on                   # Log connection attempts
log_disconnections = on                # Log disconnections
log_lock_waits = on                   # Log lock waits
log_checkpoints = on                  # Log checkpoint activity
log_autovacuum_min_duration = 0       # Log all autovacuum actions

# ====================
# CHECKPOINT TUNING
# ====================
checkpoint_timeout = 10min            # Maximum time between checkpoints
checkpoint_completion_target = 0.9    # Spread checkpoint I/O over 90% of checkpoint interval
max_wal_size = 2GB                   # Maximum size of WAL between checkpoints
min_wal_size = 512MB                 # Minimum size of WAL to reclaim

# ====================
# ERROR REPORTING
# ====================
log_error_verbosity = default         # Error message verbosity
log_statement = 'ddl'                # Log all DDL statements
client_min_messages = notice          # Client message level

# ====================
# STATISTICS
# ====================
track_activities = on                 # Track currently executing queries
track_counts = on                     # Track table statistics
track_io_timing = on                 # Track I/O timing statistics
track_functions = all                # Track function call statistics

# ====================
# SECURITY
# ====================
ssl = off                            # SSL disabled for local development (enable in production)
password_encryption = scram-sha-256  # Strong password encryption
