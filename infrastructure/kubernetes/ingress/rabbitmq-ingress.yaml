# RabbitMQ Management UI Ingress
# External access to RabbitMQ management interface
# Version: 1.0
# Created: 2025-11-23
# WARNING: Protect this endpoint with authentication in production

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-ingress
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: messaging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Basic auth (create secret first)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: rabbitmq-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "RabbitMQ Management - Authentication Required"

    # IP whitelist (replace with your IPs)
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"

    # Certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  tls:
  - hosts:
    - rabbitmq.cryptobot.example.com
    secretName: rabbitmq-tls-cert

  rules:
  - host: rabbitmq.cryptobot.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq-service
            port:
              number: 15672
