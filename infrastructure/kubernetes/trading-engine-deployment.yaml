# Trading Engine Kubernetes Deployment - Phase 7 HA Configuration
# High Availability deployment with comprehensive health checks
# Version: 2.0 - Phase 7 HA & Monitoring
# Created: 2025-12-11
#
# Features:
# - Multiple replicas with rolling update strategy
# - Comprehensive health probes (liveness, readiness, startup)
# - Resource limits and requests for proper scheduling
# - Pod anti-affinity for high availability
# - Prometheus metrics scraping
# - Init containers for dependency verification

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: core-service
    service: trading-engine
    version: v2.0.0
    tier: backend
    phase: "7"
  annotations:
    description: "Trading Engine - Core trading decision-making and execution service"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8005"
    prometheus.io/path: "/metrics"
spec:
  # High Availability: Multiple replicas
  replicas: 3

  # Deployment strategy: Rolling update for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Allow one extra pod during update
      maxSurge: 1
      # Never have less than all pods available during update
      maxUnavailable: 0

  # Minimum time a pod must be ready before considered available
  minReadySeconds: 10

  # Revision history for rollbacks
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine

  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: core-service
        service: trading-engine
        version: v2.0.0
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
        # Force restart on config change
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"

    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Service account for RBAC
      serviceAccountName: trading-engine-sa

      # Termination grace period for clean shutdown
      terminationGracePeriodSeconds: 60

      # Init containers - Verify dependencies before starting
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres-service 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

        # Wait for Redis to be ready
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis-service 6379; do
                echo "Redis not ready, waiting..."
                sleep 2
              done
              echo "Redis is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

        # Wait for RabbitMQ to be ready
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until nc -z rabbitmq-service 5672; do
                echo "RabbitMQ not ready, waiting..."
                sleep 2
              done
              echo "RabbitMQ is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

        # Wait for Technical Analysis service
        - name: wait-for-technical-analysis
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Technical Analysis service..."
              until curl -sf http://technical-analysis-service:8004/health > /dev/null 2>&1; do
                echo "Technical Analysis not ready, waiting..."
                sleep 3
              done
              echo "Technical Analysis is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      # Main container
      containers:
        - name: trading-engine
          image: crypto-bot/trading-engine:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMaps and Secrets
          envFrom:
            - configMapRef:
                name: trading-engine-config
            - secretRef:
                name: trading-engine-secrets
            - secretRef:
                name: db-secrets
            - secretRef:
                name: api-secrets

          env:
            - name: SERVICE_NAME
              value: "trading-engine"
            - name: SERVICE_PORT
              value: "8005"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: trading-engine-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-engine-config
                  key: LOG_LEVEL
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "trading-engine"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector:4317"

          # Resource management - Critical for trading service
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Liveness probe - Check if the process is alive
          # Restarts the container if this fails
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe - Check if ready to receive traffic
          # Removes from service endpoints if this fails
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Startup probe - Allow longer startup time
          # Disables liveness/readiness until this passes
          startupProbe:
            httpGet:
              path: /health
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1

          # Volume mounts
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
              readOnly: true

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Lifecycle hooks for graceful shutdown
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Gracefully shutting down trading engine..."
                    # Signal the application to stop accepting new trades
                    curl -X POST http://localhost:8005/api/v1/trading/stop || true
                    # Wait for in-flight operations to complete
                    sleep 30
                    echo "Shutdown complete"

      # Volumes
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: data
          emptyDir:
            sizeLimit: 5Gi
        - name: config
          configMap:
            name: trading-engine-config
            items:
              - key: config.yaml
                path: config.yaml

      # Pod Anti-Affinity for High Availability
      # Ensures pods are distributed across nodes
      affinity:
        podAntiAffinity:
          # Prefer different nodes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: service
                      operator: In
                      values:
                        - trading-engine
                topologyKey: kubernetes.io/hostname
          # Require different availability zones
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - trading-engine
              topologyKey: topology.kubernetes.io/zone
              namespaces:
                - crypto-bot

        # Node affinity - Prefer nodes with SSD storage
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - m5.xlarge
                      - m5.2xlarge
                      - c5.xlarge
                      - c5.2xlarge

      # Topology spread for even distribution
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              service: trading-engine
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              service: trading-engine

      # Restart policy
      restartPolicy: Always

      # DNS policy
      dnsPolicy: ClusterFirst

---
# Service for Trading Engine
apiVersion: v1
kind: Service
metadata:
  name: trading-engine-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8005"
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    service: trading-engine
  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless Service for StatefulSet-like behavior (optional)
apiVersion: v1
kind: Service
metadata:
  name: trading-engine-headless
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: crypto-trading-bot
    service: trading-engine
  ports:
    - name: http
      port: 8005
      targetPort: 8005

---
# ServiceAccount for Trading Engine
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-engine-sa
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine

---
# PodDisruptionBudget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-engine-pdb
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine
spec:
  # Always keep at least 2 pods running
  minAvailable: 2
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine

---
# HorizontalPodAutoscaler for automatic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-engine-hpa
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale based on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on custom metrics (requests per second)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min

---
# ConfigMap for Trading Engine
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-engine-config
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    service: trading-engine
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  SERVICE_NAME: "trading-engine"
  SERVICE_PORT: "8005"
  TRADING_MODE: "PAPER"
  AUTO_TRADING_ENABLED: "true"

  # Service URLs
  TECHNICAL_ANALYSIS_URL: "http://technical-analysis-service:8004"
  BYBIT_CONNECTOR_URL: "http://bybit-connector-service:8001"
  PORTFOLIO_MANAGER_URL: "http://portfolio-manager-service:8003"
  MARKET_DATA_URL: "http://market-data-service:8002"

  # Database
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "trading_db"

  # Redis
  REDIS_URL: "redis://redis-service:6379/0"

  # RabbitMQ
  RABBITMQ_URL: "amqp://rabbitmq-service:5672"

  # Monitoring
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"

  # Tracing
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"

  # Trading Parameters
  PAPER_INITIAL_BALANCE: "100"
  MAX_POSITION_SIZE_PCT: "5"
  MAX_DAILY_LOSS_PCT: "3"

  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"

  # Config file
  config.yaml: |
    service:
      name: trading-engine
      port: 8005
      environment: production

    trading:
      mode: paper
      auto_trading: true
      max_positions: 5
      risk_per_trade_pct: 2.0
      max_daily_loss_pct: 5.0

    monitoring:
      prometheus:
        enabled: true
        port: 9090
      tracing:
        enabled: true
        service_name: trading-engine
      health_check:
        interval: 30
        timeout: 10

    circuit_breaker:
      failure_threshold: 5
      success_threshold: 3
      timeout_seconds: 60
      half_open_max_calls: 3
