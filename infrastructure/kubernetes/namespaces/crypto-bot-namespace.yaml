# Namespace for Crypto Trading Bot
# Provides logical isolation for all bot resources
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Namespace
metadata:
  name: crypto-bot
  labels:
    name: crypto-bot
    app: crypto-trading-bot
    environment: production
    managed-by: kubernetes
    version: "1.0"
  annotations:
    description: "Autonomous cryptocurrency trading bot microservices"
    team: "crypto-bot-team"
    contact: "devops@cryptobot.local"
---
# Resource quota for the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crypto-bot-quota
  namespace: crypto-bot
spec:
  hard:
    # Maximum number of pods
    pods: "100"
    # Total CPU resources
    requests.cpu: "50"
    limits.cpu: "100"
    # Total memory resources
    requests.memory: 64Gi
    limits.memory: 128Gi
    # Persistent volume claims
    persistentvolumeclaims: "20"
    # Services
    services: "30"
    # Secrets
    secrets: "50"
    # ConfigMaps
    configmaps: "50"
---
# Limit range for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: crypto-bot-limit-range
  namespace: crypto-bot
spec:
  limits:
  # Default limits for containers
  - type: Container
    default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: "100m"
      memory: 128Mi
    max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: "10m"
      memory: 16Mi
  # Default limits for pods
  - type: Pod
    max:
      cpu: "16"
      memory: 32Gi
  # Persistent volume claim limits
  - type: PersistentVolumeClaim
    max:
      storage: 100Gi
    min:
      storage: 1Gi
