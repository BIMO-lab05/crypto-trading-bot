# Monitoring and observability configuration
# Prometheus, Grafana, and alerting settings
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'crypto-bot-prod'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    # Scrape configurations
    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - crypto-bot
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Application services
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway-service:9090']
            labels:
              service: 'api-gateway'

      - job_name: 'trading-engine'
        static_configs:
          - targets: ['trading-engine-service:9090']
            labels:
              service: 'trading-engine'

      - job_name: 'portfolio-manager'
        static_configs:
          - targets: ['portfolio-manager-service:9090']
            labels:
              service: 'portfolio-manager'

      - job_name: 'technical-analysis'
        static_configs:
          - targets: ['technical-analysis-service:9090']
            labels:
              service: 'technical-analysis'

      - job_name: 'bybit-connector'
        static_configs:
          - targets: ['bybit-connector-service:9090']
            labels:
              service: 'bybit-connector'

      - job_name: 'market-data-service'
        static_configs:
          - targets: ['market-data-service:9090']
            labels:
              service: 'market-data-service'

      # Database metrics
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels:
              database: 'postgres'

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
            labels:
              database: 'redis'

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq-service:15692']
            labels:
              messaging: 'rabbitmq'

  alerts.yml: |
    groups:
      - name: crypto_bot_alerts
        interval: 30s
        rules:
          # High CPU usage
          - alert: HighCPUUsage
            expr: rate(process_cpu_seconds_total[5m]) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is above 80% for {{ $labels.service }}"

          # High memory usage
          - alert: HighMemoryUsage
            expr: process_resident_memory_bytes / 1024 / 1024 > 900
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Memory usage is above 900MB for {{ $labels.service }}"

          # Service down
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "{{ $labels.job }} has been down for more than 1 minute"

          # High error rate
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for {{ $labels.service }}"

          # Trading engine stopped
          - alert: TradingEngineStopped
            expr: up{job="trading-engine"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Trading engine is down"
              description: "Trading engine has stopped - immediate attention required"

          # Position loss threshold
          - alert: PositionLossThreshold
            expr: portfolio_unrealized_pnl < -0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Position loss exceeds threshold"
              description: "Unrealized P&L is below -5%, consider emergency stop"

          # Database connection issues
          - alert: DatabaseConnectionFailed
            expr: database_connection_errors > 10
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Database connection failures"
              description: "Multiple database connection failures detected"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: monitoring
data:
  # Grafana dashboard provisioning
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Crypto Bot Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

  # Trading overview dashboard
  trading-overview.json: |
    {
      "dashboard": {
        "title": "Crypto Bot - Trading Overview",
        "panels": [
          {
            "title": "Active Positions",
            "targets": [{"expr": "portfolio_active_positions"}],
            "type": "stat"
          },
          {
            "title": "Total P&L",
            "targets": [{"expr": "sum(portfolio_realized_pnl + portfolio_unrealized_pnl)"}],
            "type": "graph"
          },
          {
            "title": "Win Rate",
            "targets": [{"expr": "sum(trades_profitable) / sum(trades_total) * 100"}],
            "type": "gauge"
          },
          {
            "title": "Trade Volume (24h)",
            "targets": [{"expr": "sum(increase(trades_total[24h]))"}],
            "type": "stat"
          }
        ]
      }
    }

  # System health dashboard
  system-health.json: |
    {
      "dashboard": {
        "title": "Crypto Bot - System Health",
        "panels": [
          {
            "title": "Service Status",
            "targets": [{"expr": "up"}],
            "type": "table"
          },
          {
            "title": "CPU Usage",
            "targets": [{"expr": "rate(process_cpu_seconds_total[5m]) * 100"}],
            "type": "graph"
          },
          {
            "title": "Memory Usage",
            "targets": [{"expr": "process_resident_memory_bytes / 1024 / 1024"}],
            "type": "graph"
          },
          {
            "title": "Request Rate",
            "targets": [{"expr": "rate(http_requests_total[5m])"}],
            "type": "graph"
          }
        ]
      }
    }
