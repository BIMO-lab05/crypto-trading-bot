---
# Bybit Exchange Secrets - Staging
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bybit-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: exchange
    environment: staging
    security-level: critical
spec:
  # More frequent refresh for exchange credentials
  refreshInterval: "30m"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: bybit-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          # WARNING: Critical security - exchange API keys
          security-level: critical
          audit-required: "true"
  data:
    - secretKey: BYBIT_API_KEY
      remoteRef:
        key: crypto-bot/staging/bybit
        property: api_key

    - secretKey: BYBIT_API_SECRET
      remoteRef:
        key: crypto-bot/staging/bybit
        property: api_secret

    - secretKey: BYBIT_NETWORK
      remoteRef:
        key: crypto-bot/staging/bybit
        property: network

