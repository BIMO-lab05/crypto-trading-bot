# External Secret Templates for Crypto Trading Bot
# These ExternalSecret resources sync secrets from Vault to Kubernetes
# Version: 1.0
# Created: 2025-12-12
#
# USAGE:
# 1. Store secrets in Vault at the specified paths
# 2. Apply these templates to create Kubernetes secrets automatically
# 3. Secrets will be synced and rotated automatically

---
# Database Secrets - Staging
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: database
    environment: staging
spec:
  # Refresh interval for secret rotation
  refreshInterval: "1h"

  # Reference to the SecretStore
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore

  # Target Kubernetes secret
  target:
    name: db-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: crypto-trading-bot
          component: database
          environment: staging
        annotations:
          managed-by: external-secrets
          last-rotation: "{{ .timestamp }}"

  # Data mappings from Vault
  data:
    # PostgreSQL credentials
    - secretKey: POSTGRES_USER
      remoteRef:
        key: crypto-bot/staging/database
        property: postgres_user

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: crypto-bot/staging/database
        property: postgres_password

    - secretKey: POSTGRES_DB
      remoteRef:
        key: crypto-bot/staging/database
        property: postgres_db

    # TimescaleDB credentials
    - secretKey: TIMESCALE_USER
      remoteRef:
        key: crypto-bot/staging/database
        property: timescale_user

    - secretKey: TIMESCALE_PASSWORD
      remoteRef:
        key: crypto-bot/staging/database
        property: timescale_password

    - secretKey: TIMESCALE_DB
      remoteRef:
        key: crypto-bot/staging/database
        property: timescale_db

    # Redis credentials
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: crypto-bot/staging/database
        property: redis_password

    # RabbitMQ credentials
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: crypto-bot/staging/database
        property: rabbitmq_user

    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: crypto-bot/staging/database
        property: rabbitmq_password

