          emptyDir:
            sizeLimit: 200Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    service: bybit-connector
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

