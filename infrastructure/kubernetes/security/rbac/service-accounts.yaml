# Service Accounts for Crypto Trading Bot
# Least-privilege service accounts for each microservice
# Version: 1.0
# Created: 2025-12-12
#
# PRINCIPLE: Each service has its own ServiceAccount with minimal permissions
# Do NOT use the default ServiceAccount

---
# ============================================
# STAGING ENVIRONMENT SERVICE ACCOUNTS
# ============================================

# API Gateway Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: api-gateway
    environment: staging
  annotations:
    description: "Service account for API Gateway - entry point for all requests"
automountServiceAccountToken: false  # Only mount if explicitly needed

---
# Trading Engine Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-engine-sa
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
  annotations:
    description: "Service account for Trading Engine - core trading logic"
automountServiceAccountToken: false

---
# Bybit Connector Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bybit-connector-sa
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: bybit-connector
    environment: staging
  annotations:
    description: "Service account for Bybit Connector - exchange API access"
    security-level: "critical"
automountServiceAccountToken: false

---
