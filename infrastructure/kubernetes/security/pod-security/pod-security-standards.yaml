# Pod Security Standards Configuration
# Enforces security best practices for all pods in crypto-bot namespaces
# Version: 1.0
# Created: 2025-12-12
#
# Pod Security Standards Profiles:
# - privileged: Unrestricted (avoid)
# - baseline: Minimally restrictive (development)
# - restricted: Highly restrictive (production recommended)
#
# This configuration enforces the 'restricted' profile for production
# and 'baseline' with warnings for staging

---
# Staging Namespace with Pod Security Standards
apiVersion: v1
kind: Namespace
metadata:
  name: trading-bot-staging
  labels:
    name: trading-bot-staging
    app: crypto-trading-bot
    environment: staging
    # Pod Security Standards labels
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    description: "Staging environment for crypto trading bot"
    security-profile: "baseline (enforced), restricted (warned)"

---
# Production Namespace with Strict Pod Security Standards
apiVersion: v1
kind: Namespace
metadata:
  name: crypto-bot
  labels:
    name: crypto-bot
    app: crypto-trading-bot
    environment: production
    # Pod Security Standards labels - RESTRICTED profile enforced
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    description: "Production environment for crypto trading bot"
    security-profile: "restricted (enforced)"

---
# Resource Quota for Staging
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: trading-bot-staging
spec:
  hard:
    pods: "50"
    requests.cpu: "20"
    limits.cpu: "40"
    requests.memory: 32Gi
    limits.memory: 64Gi
    persistentvolumeclaims: "15"
    services: "20"
    secrets: "30"
    configmaps: "30"

---
# Resource Quota for Production
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: crypto-bot
spec:
  hard:
    pods: "100"
    requests.cpu: "50"
    limits.cpu: "100"
    requests.memory: 64Gi
    limits.memory: 128Gi
    persistentvolumeclaims: "20"
    services: "30"
    secrets: "50"
    configmaps: "50"

---
# LimitRange for Staging - Sets default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limit-range
  namespace: trading-bot-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: "10m"
        memory: 16Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 8Gi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi

---
# LimitRange for Production - Stricter limits
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limit-range
  namespace: crypto-bot
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: "10m"
        memory: 16Mi
    - type: Pod
      max:
        cpu: "16"
        memory: 32Gi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi
