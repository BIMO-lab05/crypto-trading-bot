# PostgreSQL Service
# Internal cluster access to PostgreSQL database
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: database
    database: postgres
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet

  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP

  selector:
    app: crypto-trading-bot
    component: database
    database: postgres

  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
