apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: messaging
spec:
  type: ClusterIP
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  - name: prometheus
    port: 15692
    targetPort: 15692
  selector:
    app: crypto-trading-bot
    component: messaging
