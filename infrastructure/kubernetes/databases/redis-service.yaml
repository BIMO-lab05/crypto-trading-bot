apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: cache
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: crypto-trading-bot
    component: cache
    database: redis
