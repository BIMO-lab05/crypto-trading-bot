# =============================================================================
# Infrastructure ServiceMonitor Configurations
# Kubernetes Staging Environment
# Version: 1.0.0
# =============================================================================
# ServiceMonitors for infrastructure components (databases, cache, messaging)
# =============================================================================

---
# =============================================================================
# POSTGRESQL EXPORTER SERVICE MONITOR
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: crypto-bot-staging
  labels:
    app: postgres-exporter
    environment: staging
    component: database
    critical: "true"
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
  namespaceSelector:
    matchNames:
      - crypto-bot-staging

---
