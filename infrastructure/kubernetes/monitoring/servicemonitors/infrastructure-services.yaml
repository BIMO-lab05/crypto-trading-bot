---
# =============================================================================
# RABBITMQ EXPORTER SERVICE MONITOR
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-exporter
  namespace: crypto-bot-staging
  labels:
    app: rabbitmq-exporter
    environment: staging
    component: messaging
    critical: "true"
