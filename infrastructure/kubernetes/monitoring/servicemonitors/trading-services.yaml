# =============================================================================
# ServiceMonitor Configurations for Crypto Trading Bot
# Kubernetes Staging Environment
# Version: 1.0.0
# =============================================================================
# ServiceMonitors tell Prometheus Operator which services to scrape
# These are designed for the Kubernetes staging deployment
# =============================================================================

---
# =============================================================================
# TRADING ENGINE SERVICE MONITOR
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading-engine
  namespace: crypto-bot-staging
  labels:
    app: trading-engine
    environment: staging
    tier: core
    critical: "true"
spec:
  selector:
    matchLabels:
      app: trading-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 8s
      scheme: http
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "go_.*|process_.*"
          action: drop
  namespaceSelector:
    matchNames:
      - crypto-bot-staging

