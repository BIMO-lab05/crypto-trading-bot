# Staging Databases - PostgreSQL, TimescaleDB, Redis, RabbitMQ
# Version: 1.0
# Created: 2025-12-12
#
# Database infrastructure for staging environment

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: database
    database: postgres
    environment: staging
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: crypto-trading-bot
      database: postgres
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: database
        database: postgres
        environment: staging
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: db-secrets
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cryptobot_staging
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cryptobot_staging
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    database: postgres
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    database: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres

---
# TimescaleDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescale
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: database
    database: timescaledb
    environment: staging
spec:
  serviceName: timescale-headless
  replicas: 1
  selector:
    matchLabels:
      app: crypto-trading-bot
      database: timescaledb
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: database
        database: timescaledb
        environment: staging
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg15
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: timescale
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: TIMESCALE_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: TIMESCALE_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: TIMESCALE_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: timescale-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - timescale_staging
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - timescale_staging
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: timescale-data
        persistentVolumeClaim:
          claimName: timescale-pvc

---
# TimescaleDB Service
apiVersion: v1
kind: Service
metadata:
  name: timescale-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    database: timescaledb
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    database: timescaledb
  ports:
  - port: 5432
    targetPort: 5432
    name: timescale

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: cache
    database: redis
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crypto-trading-bot
      database: redis
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: cache
        database: redis
        environment: staging
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    database: redis
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    database: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

---
# RabbitMQ StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: messaging
    environment: staging
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: crypto-trading-bot
      component: messaging
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: messaging
        environment: staging
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_DEFAULT_VHOST
          value: staging
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        livenessProbe:
          exec:
            command:
            - rabbitmqctl
            - status
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - rabbitmqctl
            - status
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-pvc

---
# RabbitMQ Service
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: messaging
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    component: messaging
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
