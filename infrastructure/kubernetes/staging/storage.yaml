# Staging Storage - Persistent Volume Claims
# Version: 1.0
# Created: 2025-12-12
#
# Storage configuration for staging environment
# Uses smaller sizes compared to production

---
# PostgreSQL PVC - Main database storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: database
    database: postgres
    environment: staging
  annotations:
    description: "PostgreSQL data storage for staging"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Use default storage class or specify explicitly
  # storageClassName: standard

---
# TimescaleDB PVC - Time-series market data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescale-pvc
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: database
    database: timescaledb
    environment: staging
  annotations:
    description: "TimescaleDB storage for market data in staging"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: standard

