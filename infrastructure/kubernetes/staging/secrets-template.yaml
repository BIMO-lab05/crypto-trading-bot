# ============================================================================
# Staging Secrets Template for Crypto Trading Bot
# ============================================================================
#
# SECURITY NOTICE:
# - This is a TEMPLATE file - DO NOT put real secrets here
# - Copy to secrets.yaml and replace all placeholders before deployment
# - secrets.yaml is ignored by git (.gitignore)
# - Use sealed-secrets, external-secrets, or Vault for production
#
# HOW TO USE:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate secrets using the commands below
# 3. Base64 encode your secrets: echo -n "your-secret" | base64
# 4. Replace all <PLACEHOLDER> values with base64-encoded secrets
# 5. Apply: kubectl apply -f secrets.yaml
#
# GENERATE SECURE SECRETS:
#   # Generate random password (32 bytes)
#   openssl rand -base64 32
#
#   # Generate JWT secret (64 hex characters)
#   openssl rand -hex 64
#
#   # Base64 encode for Kubernetes
#   echo -n "your-generated-secret" | base64
#
# ============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    environment: staging
  annotations:
    description: "Database credentials for staging environment"
    last-rotated: "<DATE_OF_LAST_ROTATION>"
type: Opaque
data:
  # PostgreSQL credentials
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  POSTGRES_USER: <BASE64_ENCODED_USERNAME>
  POSTGRES_PASSWORD: <BASE64_ENCODED_PASSWORD_32_CHARS_MIN>
  POSTGRES_DB: <BASE64_ENCODED_DATABASE_NAME>

  # TimescaleDB credentials
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  TIMESCALE_USER: <BASE64_ENCODED_USERNAME>
  TIMESCALE_PASSWORD: <BASE64_ENCODED_PASSWORD_32_CHARS_MIN>
  TIMESCALE_DB: <BASE64_ENCODED_DATABASE_NAME>

  # Redis credentials
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  REDIS_PASSWORD: <BASE64_ENCODED_PASSWORD_32_CHARS_MIN>

  # RabbitMQ credentials
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  RABBITMQ_USER: <BASE64_ENCODED_USERNAME>
  RABBITMQ_PASSWORD: <BASE64_ENCODED_PASSWORD_32_CHARS_MIN>

  # Connection URLs (update after setting individual credentials)
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: <BASE64_ENCODED_FULL_DATABASE_URL>
  TIMESCALE_URL: <BASE64_ENCODED_FULL_TIMESCALE_URL>
  REDIS_URL: <BASE64_ENCODED_FULL_REDIS_URL>
  RABBITMQ_URL: <BASE64_ENCODED_FULL_RABBITMQ_URL>

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    environment: staging
  annotations:
    description: "API authentication secrets for staging environment"
    last-rotated: "<DATE_OF_LAST_ROTATION>"
type: Opaque
data:
  # JWT secret for API authentication
  # CRITICAL: Must be at least 64 hex characters for production security
  # Generate: openssl rand -hex 64 | tr -d '\n' | base64
  JWT_SECRET_KEY: <BASE64_ENCODED_JWT_SECRET_64_HEX_CHARS_MIN>

  # API authentication token for service-to-service communication
  # Generate: openssl rand -hex 32 | tr -d '\n' | base64
  API_TOKEN: <BASE64_ENCODED_API_TOKEN>

  # Internal service communication key
  # Generate: openssl rand -hex 32 | tr -d '\n' | base64
  INTERNAL_API_KEY: <BASE64_ENCODED_INTERNAL_API_KEY>

  # Telegram bot token (optional - leave empty if not using)
  # Get from @BotFather on Telegram
  TELEGRAM_BOT_TOKEN: ""

  # Email SMTP credentials (optional - leave empty if not using)
  SMTP_USER: ""
  SMTP_PASSWORD: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: bybit-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    environment: staging
  annotations:
    description: "Exchange API credentials for staging (TESTNET ONLY)"
    last-rotated: "<DATE_OF_LAST_ROTATION>"
type: Opaque
data:
  # Bybit TESTNET credentials
  # IMPORTANT: Use TESTNET keys only for staging!
  # Get from: https://testnet.bybit.com/
  # Base64 encode: echo -n "your-api-key" | base64
  BYBIT_API_KEY: <BASE64_ENCODED_TESTNET_API_KEY>
  BYBIT_API_SECRET: <BASE64_ENCODED_TESTNET_API_SECRET>

  # Network identifier (should be "testnet" for staging)
  # echo -n "testnet" | base64 = dGVzdG5ldA==
  BYBIT_NETWORK: dGVzdG5ldA==

  # Additional exchange credentials (optional - for multi-exchange support)
  # Leave empty string "" if not using
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  BINANCE_TESTNET: dHJ1ZQ==  # "true" base64 encoded

  KRAKEN_API_KEY: ""
  KRAKEN_API_SECRET: ""

  COINBASE_API_KEY: ""
  COINBASE_API_SECRET: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: trading-engine-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
  annotations:
    description: "Trading engine specific secrets"
    last-rotated: "<DATE_OF_LAST_ROTATION>"
type: Opaque
data:
  # Encryption key for sensitive data at rest
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  ENCRYPTION_KEY: <BASE64_ENCODED_ENCRYPTION_KEY>

  # Signing key for data integrity verification
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  SIGNING_KEY: <BASE64_ENCODED_SIGNING_KEY>

---
# ServiceMonitor secret for Prometheus
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-secrets
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: monitoring
    environment: staging
  annotations:
    description: "Monitoring system credentials"
    last-rotated: "<DATE_OF_LAST_ROTATION>"
type: Opaque
data:
  # Grafana admin password
  # Generate: openssl rand -base64 24 | tr -d '\n' | base64
  GRAFANA_ADMIN_PASSWORD: <BASE64_ENCODED_GRAFANA_PASSWORD>

  # AlertManager SMTP password (optional)
  ALERTMANAGER_SMTP_PASSWORD: ""

# ============================================================================
# DEPLOYMENT CHECKLIST
# ============================================================================
# [ ] All <PLACEHOLDER> values replaced with actual base64-encoded secrets
# [ ] Secrets generated using cryptographically secure methods (openssl rand)
# [ ] Passwords are at least 32 characters before base64 encoding
# [ ] JWT_SECRET_KEY is at least 64 hex characters before base64 encoding
# [ ] BYBIT_NETWORK is set to "testnet" (dGVzdG5ldA==)
# [ ] This file is NOT committed to git (check .gitignore)
# [ ] Secrets have been documented in secure password manager
# [ ] Last rotation date updated in annotations
# [ ] Namespace exists before applying
# ============================================================================
#
# QUICK REFERENCE - Common base64 values:
# "testnet" = dGVzdG5ldA==
# "true" = dHJ1ZQ==
# "false" = ZmFsc2U=
# "staging" = c3RhZ2luZw==
#
# APPLY COMMAND:
# kubectl apply -f secrets.yaml
#
# VERIFY SECRETS:
# kubectl get secrets -n trading-bot-staging
# kubectl describe secret db-secrets -n trading-bot-staging
# ============================================================================
