# Microservices Deployments for Staging
# All core services with health probes and HA configuration
# Version: 1.0
# Created: 2025-12-12

---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: api-gateway
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: api-gateway
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        service: api-gateway
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: default
      containers:
        - name: api-gateway
          image: crypto-bot/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: crypto-trading-bot
    service: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
# Portfolio Manager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-manager
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: portfolio-manager
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: portfolio-manager
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        service: portfolio-manager
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do sleep 2; done']
      containers:
        - name: portfolio-manager
          image: crypto-bot/portfolio-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-manager-service
  namespace: trading-bot-staging
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    service: portfolio-manager
  ports:
    - port: 8003
      targetPort: 8003
      name: http

