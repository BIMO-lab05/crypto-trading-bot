# Staging ConfigMap for Crypto Trading Bot
# Configuration for staging environment
# Version: 1.0
# Created: 2025-12-12

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    environment: staging
data:
  # Environment settings
  ENVIRONMENT: "staging"
  LOG_LEVEL: "DEBUG"
  DEBUG_MODE: "true"

  # Trading mode - ALWAYS paper for staging
  TRADING_MODE: "PAPER"
  AUTO_TRADING_ENABLED: "false"

  # Service URLs (internal DNS)
  API_GATEWAY_URL: "http://api-gateway-service:8000"
  TRADING_ENGINE_URL: "http://trading-engine-service:8005"
  PORTFOLIO_MANAGER_URL: "http://portfolio-manager-service:8003"
  TECHNICAL_ANALYSIS_URL: "http://technical-analysis-service:8004"
  BYBIT_CONNECTOR_URL: "http://bybit-connector-service:8001"
  MARKET_DATA_URL: "http://market-data-service:8002"
  ML_PREDICTION_URL: "http://ml-prediction-service:8007"
  RISK_METRICS_URL: "http://risk-metrics-service:8008"
  NOTIFICATION_URL: "http://notification-service:8006"
  SENTIMENT_ANALYSIS_URL: "http://sentiment-analysis-service:8009"

  # Database configuration (non-sensitive)
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "trading_db_staging"
  TIMESCALE_HOST: "timescale-service"
  TIMESCALE_PORT: "5432"
  TIMESCALE_DATABASE: "market_data_staging"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # RabbitMQ configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "staging"

  # Monitoring
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"

  # Health check settings
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"

  # Trading parameters (staging - conservative)
  PAPER_INITIAL_BALANCE: "100"
  MAX_POSITION_SIZE_PCT: "2"
  MAX_DAILY_LOSS_PCT: "3"
  MAX_POSITIONS: "3"
  RISK_PER_TRADE_PCT: "1"

  # Feature flags (staging)
  ENABLE_ML_PREDICTIONS: "true"
  ENABLE_SENTIMENT_ANALYSIS: "true"
  ENABLE_NOTIFICATIONS: "true"
  ENABLE_DYNAMIC_RISK: "true"
  ENABLE_TWAP_VWAP: "true"
  ENABLE_MULTI_EXCHANGE: "true"

  # Circuit breaker settings
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_SUCCESS_THRESHOLD: "3"
  CIRCUIT_BREAKER_TIMEOUT: "60"

  # Rate limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"

---
# Trading Engine specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-engine-config
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "DEBUG"
  SERVICE_NAME: "trading-engine"
  SERVICE_PORT: "8005"
  TRADING_MODE: "PAPER"
  AUTO_TRADING_ENABLED: "false"

  # Service URLs
  TECHNICAL_ANALYSIS_URL: "http://technical-analysis-service:8004"
  BYBIT_CONNECTOR_URL: "http://bybit-connector-service:8001"
  PORTFOLIO_MANAGER_URL: "http://portfolio-manager-service:8003"
  MARKET_DATA_URL: "http://market-data-service:8002"

  # Database
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "trading_db_staging"

  # Redis
  REDIS_URL: "redis://redis-service:6379/0"

  # RabbitMQ
  RABBITMQ_URL: "amqp://rabbitmq-service:5672/staging"

  # Monitoring
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"

  # Trading Parameters
  PAPER_INITIAL_BALANCE: "100"
  MAX_POSITION_SIZE_PCT: "2"
  MAX_DAILY_LOSS_PCT: "3"

  # Health Check
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"

  # Config YAML
  config.yaml: |
    service:
      name: trading-engine
      port: 8005
      environment: staging

    trading:
      mode: paper
      auto_trading: false
      max_positions: 3
      risk_per_trade_pct: 1.0
      max_daily_loss_pct: 3.0

    monitoring:
      prometheus:
        enabled: true
        port: 9090
      tracing:
        enabled: true
        service_name: trading-engine
      health_check:
        interval: 30
        timeout: 10

    circuit_breaker:
      failure_threshold: 5
      success_threshold: 3
      timeout_seconds: 60
      half_open_max_calls: 3

    risk_management:
      dynamic_risk_enabled: true
      twap_enabled: true
      vwap_enabled: true
      max_slippage_pct: 0.5

---
# Monitoring configuration for staging
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: monitoring
    environment: staging
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: staging
        cluster: trading-bot-staging

    alerting:
      alertmanagers:
      - static_configs:
        - targets: []

    rule_files: []

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'trading-engine'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - trading-bot-staging
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_service]
            regex: trading-engine
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+)
            replacement: ${1}:8005

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - trading-bot-staging
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
