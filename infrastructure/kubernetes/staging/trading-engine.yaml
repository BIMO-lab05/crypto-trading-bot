# Trading Engine Deployment for Staging
# High Availability configuration with comprehensive health checks
# Version: 2.0 - Phase 7 HA Configuration
# Created: 2025-12-12
#
# Features:
# - 3 replicas with rolling update strategy
# - HPA configuration (2-10 pods, 70% CPU, 80% memory)
# - Comprehensive health probes (liveness, readiness, startup)
# - Pod anti-affinity for HA
# - Init containers for dependency verification

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    component: core-service
    service: trading-engine
    version: v2.0.0
    tier: backend
    environment: staging
  annotations:
    description: "Trading Engine - Core trading decision-making and execution service"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8005"
    prometheus.io/path: "/metrics"
spec:
  # High Availability: 3 replicas as requested
  replicas: 3

  # Rolling update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Minimum time a pod must be ready before considered available
  minReadySeconds: 10

  # Revision history for rollbacks
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine

  template:
    metadata:
      labels:
        app: crypto-trading-bot
        component: core-service
        service: trading-engine
        version: v2.0.0
        tier: backend
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"

    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Service account for RBAC
      serviceAccountName: trading-engine-sa

      # Termination grace period for clean shutdown
      terminationGracePeriodSeconds: 60

      # Init containers - Verify dependencies before starting
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres-service 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

        # Wait for Redis to be ready
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis-service 6379; do
                echo "Redis not ready, waiting..."
                sleep 2
              done
              echo "Redis is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

        # Wait for RabbitMQ to be ready
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until nc -z rabbitmq-service 5672; do
                echo "RabbitMQ not ready, waiting..."
                sleep 2
              done
              echo "RabbitMQ is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      # Main container
      containers:
        - name: trading-engine
          image: crypto-bot/trading-engine:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMaps and Secrets
          envFrom:
            - configMapRef:
                name: trading-engine-config
            - secretRef:
                name: trading-engine-secrets
            - secretRef:
                name: db-secrets
            - secretRef:
                name: api-secrets

          env:
            - name: SERVICE_NAME
              value: "trading-engine"
            - name: SERVICE_PORT
              value: "8005"
            - name: ENVIRONMENT
              value: "staging"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # Resource management
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Liveness probe - Check if the process is alive
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe - Check if ready to receive traffic
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Startup probe - Allow longer startup time
          startupProbe:
            httpGet:
              path: /health
              port: 8005
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1

          # Volume mounts
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
              readOnly: true

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Lifecycle hooks for graceful shutdown
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Gracefully shutting down trading engine..."
                    curl -X POST http://localhost:8005/api/v1/trading/stop || true
                    sleep 30
                    echo "Shutdown complete"

      # Volumes
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: data
          emptyDir:
            sizeLimit: 5Gi
        - name: config
          configMap:
            name: trading-engine-config
            items:
              - key: config.yaml
                path: config.yaml

      # Pod Anti-Affinity for High Availability
      affinity:
        podAntiAffinity:
          # Prefer different nodes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: service
                      operator: In
                      values:
                        - trading-engine
                topologyKey: kubernetes.io/hostname

      # Topology spread for even distribution
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              service: trading-engine

      # Restart policy
      restartPolicy: Always

      # DNS policy
      dnsPolicy: ClusterFirst

---
# Service for Trading Engine
apiVersion: v1
kind: Service
metadata:
  name: trading-engine-service
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8005"
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    service: trading-engine
  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# ServiceAccount for Trading Engine
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-engine-sa
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging

---
# PodDisruptionBudget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-engine-pdb
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
spec:
  # Always keep at least 2 pods running
  minAvailable: 2
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine

---
# HorizontalPodAutoscaler - 2-10 pods, 70% CPU, 80% memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-engine-hpa
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale based on CPU utilization - 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale based on memory utilization - 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading-engine-monitor
  namespace: trading-bot-staging
  labels:
    app: crypto-trading-bot
    service: trading-engine
    environment: staging
spec:
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - trading-bot-staging
