# Kubernetes Secrets Template
# Copy this file to secrets.yaml and fill in actual values
# DO NOT commit secrets.yaml to git!

apiVersion: v1
kind: Secret
metadata:
  name: crypto-bot-secrets
  labels:
    app: crypto-trading-bot
type: Opaque
stringData:
  # Bybit API credentials
  bybit-api-key: "YOUR_BYBIT_API_KEY"
  bybit-api-secret: "YOUR_BYBIT_API_SECRET"

  # News API credentials
  news-api-key: "YOUR_NEWS_API_KEY"

  # Twitter API credentials
  twitter-api-key: "YOUR_TWITTER_API_KEY"
  twitter-api-secret: "YOUR_TWITTER_API_SECRET"
  twitter-bearer-token: "YOUR_TWITTER_BEARER_TOKEN"

  # Database credentials
  postgres-password: "YOUR_POSTGRES_PASSWORD"
  postgres-user: "crypto_trader"
  postgres-db: "crypto_trading_db"

  # Redis password (if required)
  redis-password: "YOUR_REDIS_PASSWORD"
