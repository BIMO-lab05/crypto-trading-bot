# Market-data-service Service
# Service exposure configuration
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: market-data-service-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: microservice
    service: market-data-service
  annotations:
    description: "Market-data-service service endpoint"
spec:
  type: ClusterIP
  
  ports:
  - name: http
    port: 8005
    targetPort: 8005
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  
  selector:
    app: crypto-trading-bot
    service: market-data-service
  
  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
