# Bybit-connector Service
# Service exposure configuration
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: bybit-connector-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: microservice
    service: bybit-connector
  annotations:
    description: "Bybit-connector service endpoint"
spec:
  type: ClusterIP
  
  ports:
  - name: http
    port: 8004
    targetPort: 8004
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  
  selector:
    app: crypto-trading-bot
    service: bybit-connector
  
  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
