# Portfolio-manager Service
# Service exposure configuration
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: portfolio-manager-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: microservice
    service: portfolio-manager
  annotations:
    description: "Portfolio-manager service endpoint"
spec:
  type: ClusterIP
  
  ports:
  - name: http
    port: 8002
    targetPort: 8002
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  
  selector:
    app: crypto-trading-bot
    service: portfolio-manager
  
  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
