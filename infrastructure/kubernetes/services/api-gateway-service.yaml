# Api-gateway Service
# Service exposure configuration
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: microservice
    service: api-gateway
  annotations:
    description: "Api-gateway service endpoint"
spec:
  type: LoadBalancer
  
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  
  selector:
    app: crypto-trading-bot
    service: api-gateway
  
  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
