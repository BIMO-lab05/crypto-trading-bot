# Trading-engine Service
# Service exposure configuration
# Version: 1.0
# Created: 2025-11-23

apiVersion: v1
kind: Service
metadata:
  name: trading-engine-service
  namespace: crypto-bot
  labels:
    app: crypto-trading-bot
    component: microservice
    service: trading-engine
  annotations:
    description: "Trading-engine service endpoint"
spec:
  type: ClusterIP
  
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  
  selector:
    app: crypto-trading-bot
    service: trading-engine
  
  # Session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
