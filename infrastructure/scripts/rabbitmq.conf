# RabbitMQ configuration for Crypto Trading Bot
# Optimized for inter-service messaging

# Logging
log.file.level = info
log.console = true
log.console.level = info

# Default user and vhost are set via environment variables
# RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS, RABBITMQ_DEFAULT_VHOST

# Network and protocol configuration
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and disk limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Clustering (for future scaling)
cluster_partition_handling = autoheal

# Message TTL defaults (messages older than this will be deleted)
# Individual queues can override this
# default_vhost_msg_ttl = 86400000  # 24 hours in milliseconds

# Queue master locator
queue_master_locator = min-masters

# Heartbeat
heartbeat = 60

# Channel max
channel_max = 2048

# Connection max
num_acceptors.tcp = 10

# TLS/SSL (disabled for development, enable for production)
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /path/to/ca_certificate.pem
# ssl_options.certfile = /path/to/server_certificate.pem
# ssl_options.keyfile = /path/to/server_key.pem

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json
