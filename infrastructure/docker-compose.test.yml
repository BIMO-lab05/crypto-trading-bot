# Docker Compose for Integration Testing
# Used by CI/CD pipeline to run integration tests
# Includes all services and dependencies

version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Core Services
  api-gateway:
    image: crypto-bot/api-gateway:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://test_user:test_password@postgres:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://test_user:test_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  trading-engine:
    image: crypto-bot/trading-engine:${IMAGE_TAG:-latest}
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://test_user:test_password@postgres:5432/test_db
      - REDIS_URL=redis://redis:6379/1
      - RABBITMQ_URL=amqp://test_user:test_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  portfolio-manager:
    image: crypto-bot/portfolio-manager:${IMAGE_TAG:-latest}
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://test_user:test_password@postgres:5432/test_db
      - REDIS_URL=redis://redis:6379/2
      - RABBITMQ_URL=amqp://test_user:test_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  technical-analysis:
    image: crypto-bot/technical-analysis:${IMAGE_TAG:-latest}
    ports:
