# =============================================================================
# Docker Compose - High Availability Monitoring Stack
# Crypto Trading Bot - Phase 7: HA & Advanced Monitoring
# Version: 2.0.0
# =============================================================================
#
# This compose file sets up a production-grade monitoring stack with:
# - Prometheus (metrics collection)
# - Alertmanager (alert routing)
# - Grafana (visualization)
# - Node Exporter (system metrics)
# - cAdvisor (container metrics)
# - Blackbox Exporter (endpoint probing)
# - Consul (service discovery)
# - NGINX (load balancer)
# - Loki (log aggregation)
# - Promtail (log shipping)

version: "3.8"

networks:
  monitoring:
    driver: bridge
    name: crypto-bot-monitoring
  trading-network:
    external: true
    name: crypto-trading-bot_default

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  consul_data:
    driver: local
  loki_data:
    driver: local

services:
  # ===========================================================================
  # PROMETHEUS - Metrics Collection
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--log.level=info"
    volumes:
      - ./prometheus/prometheus-ha.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts-comprehensive.yml:/etc/prometheus/alerts/alerts.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/rules/recording-rules.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - trading-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9090"

  # ===========================================================================
  # ALERTMANAGER - Alert Routing
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    hostname: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.advertise-address=0.0.0.0:9093"
      - "--web.listen-address=:9093"
      - "--log.level=info"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    environment:
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # GRAFANA - Visualization
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ALERTING_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # NODE EXPORTER - System Metrics
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # CADVISOR - Container Metrics
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # BLACKBOX EXPORTER - Endpoint Probing
  # ===========================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/config/blackbox.yml"
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring
      - trading-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # CONSUL - Service Discovery
  # ===========================================================================
  consul:
    image: hashicorp/consul:1.16
    container_name: consul
    hostname: consul
    restart: unless-stopped
    command: agent -config-file=/consul/config/config.json
    volumes:
      - ./consul/consul-config.json:/consul/config/config.json:ro
      - consul_data:/consul/data
    ports:
      - "8500:8500"  # HTTP API & UI
      - "8600:8600/udp"  # DNS
      - "8502:8502"  # gRPC
    networks:
      - monitoring
      - trading-network
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # LOKI - Log Aggregation
  # ===========================================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    hostname: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # PROMTAIL - Log Shipping
  # ===========================================================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    hostname: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy

  # ===========================================================================
  # NGINX - Load Balancer
  # ===========================================================================
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    hostname: nginx-lb
    restart: unless-stopped
    volumes:
      - ./nginx/load-balancer.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Metrics endpoint
    networks:
      - monitoring
      - trading-network
    depends_on:
      - consul
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # NGINX EXPORTER - NGINX Metrics
  # ===========================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: nginx-exporter
    hostname: nginx-exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx-lb:8080/stub_status"
    ports:
      - "9113:9113"
    networks:
      - monitoring
    depends_on:
      nginx-lb:
        condition: service_healthy

  # ===========================================================================
  # POSTGRES EXPORTER - PostgreSQL Metrics
  # ===========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: postgres-exporter
    hostname: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/trading?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - trading-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # REDIS EXPORTER - Redis Metrics
  # ===========================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=${REDIS_URL:-redis://redis:6379}
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - trading-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # RABBITMQ EXPORTER - RabbitMQ Metrics
  # ===========================================================================
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:1.0.0-RC19
    container_name: rabbitmq-exporter
    hostname: rabbitmq-exporter
    restart: unless-stopped
    environment:
      - RABBIT_URL=${RABBITMQ_URL:-http://rabbitmq:15672}
      - RABBIT_USER=${RABBITMQ_USER:-guest}
      - RABBIT_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - PUBLISH_PORT=9419
    ports:
      - "9419:9419"
    networks:
      - monitoring
      - trading-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9419/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
