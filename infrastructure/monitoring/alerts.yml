# Alert Rules for Crypto Trading Bot

groups:
  - name: service_health
    rules:
      # Service down alert
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is experiencing a high error rate (> 10%)."

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time on {{ $labels.job }}"
          description: "95th percentile response time is above 1 second."

  - name: trading_alerts
    rules:
      # Trading engine not processing
      - alert: TradingEngineIdle
        expr: rate(trades_executed_total[5m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Trading engine is idle"
          description: "No trades executed in the last 30 minutes."

      # High risk exposure
      - alert: HighRiskExposure
        expr: portfolio_risk_exposure > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High risk exposure detected"
          description: "Portfolio risk exposure is above 10%."

  - name: infrastructure_alerts
    rules:
      # High memory usage
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using more than 90% of its memory limit."

      # High CPU usage
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using more than 90% CPU."

      # Redis connection issues
      - alert: RedisConnectionFailed
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection failed"
          description: "Unable to connect to Redis."

      # RabbitMQ queue buildup
      - alert: RabbitMQQueueBuildup
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue buildup"
          description: "Queue {{ $labels.queue }} has more than 1000 messages."
