# AlertManager Configuration
# Production-grade alert routing and notification management
# Last Updated: 2025-11-21

global:
  # Global configuration
  resolve_timeout: 5m

  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${SMTP_USERNAME}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # HTTP configuration
  http_config:
    tls_config:
      insecure_skip_verify: false

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'component']

  # Wait before sending initial notification (allows grouping)
  group_wait: 10s

  # Wait before sending updates about existing alert group
  group_interval: 5m

  # Wait before re-sending notification for same alert
  repeat_interval: 4h

  # Child routes with specific matchers
  routes:
    # ===== CRITICAL ALERTS =====
    # Critical alerts - send immediately to all channels
    - match:
        severity: critical
      receiver: 'critical-all'
      group_wait: 0s  # Send immediately
      repeat_interval: 1h
      continue: false  # Don't continue to other routes

    # ===== TRADING ENGINE ALERTS =====
    # Trading engine stopped - immediate Telegram + Email
    - match:
        alertname: TradingEngineDown
      receiver: 'telegram-trading'
      group_wait: 0s
      repeat_interval: 30m

    # Daily loss exceeded - immediate Telegram + Email
    - match:
        alertname: DailyLossExceeded
      receiver: 'telegram-trading'
      group_wait: 0s
      repeat_interval: 15m

    # Risk management alerts
    - match:
        component: risk-management
      receiver: 'telegram-trading'
      group_wait: 30s
      repeat_interval: 2h

    # ===== DATABASE ALERTS =====
    # Database-specific alerts to dedicated channel
    - match_re:
        alertname: '^(Database|Postgres|Redis).*'
      receiver: 'email-database'
      repeat_interval: 2h

    - match:
        component: database
      receiver: 'email-database'
      repeat_interval: 2h

    # ===== WARNING ALERTS =====
    # Warning alerts - less urgent, longer intervals
    - match:
        severity: warning
      receiver: 'email-warnings'
      repeat_interval: 8h

    # ===== INFO ALERTS =====
    # Informational alerts - daily digest
    - match:
        severity: info
      receiver: 'email-daily-summary'
      group_wait: 1h
      group_interval: 24h
      repeat_interval: 24h

# Inhibit rules - suppress alerts when other alerts are firing
inhibit_rules:
  # Suppress warning if critical alert for same service is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']

  # Suppress info if warning or critical is firing
  - source_match_re:
      severity: '^(warning|critical)$'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']

  # Suppress individual service alerts if entire cluster is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

  # Suppress high latency alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '^High.*Latency$'
    equal: ['service']

  # Suppress memory alerts if service just restarted
  - source_match:
      alertname: 'ContainerRestarted'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['service']
    for: '10m'

# Receivers - notification integrations
receivers:
  # ===== DEFAULT RECEIVER =====
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - Crypto Bot'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'

  # ===== CRITICAL ALERTS - ALL CHANNELS =====
  - name: 'critical-all'
    # Send to Telegram
    webhook_configs:
      - url: 'http://telegram-bot:8007/webhook/telegram'
        send_resolved: true
        http_config:
          bearer_token: '${WEBHOOK_TOKEN}'
        max_alerts: 5

    # Send to Email
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }} - Crypto Bot'
          Priority: 'urgent'
          X-Priority: '1'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'
        send_resolved: true

  # ===== TELEGRAM - TRADING ALERTS =====
  - name: 'telegram-trading'
    webhook_configs:
      - url: 'http://telegram-bot:8007/webhook/telegram'
        send_resolved: true
        http_config:
          bearer_token: '${WEBHOOK_TOKEN}'
        max_alerts: 10

    # Also send email for trading alerts
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: '💹 Trading Alert: {{ .GroupLabels.alertname }}'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'
        send_resolved: true

  # ===== EMAIL - DATABASE ALERTS =====
  - name: 'email-database'
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: '🗄️ Database Alert: {{ .GroupLabels.alertname }}'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'
        send_resolved: true

  # ===== EMAIL - WARNING ALERTS =====
  - name: 'email-warnings'
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'
        send_resolved: true

  # ===== EMAIL - DAILY SUMMARY =====
  - name: 'email-daily-summary'
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${SMTP_USERNAME}'
        headers:
          Subject: 'Daily Alert Summary - {{ .Alerts.Firing | len }} alert(s) - {{ now.Format "2006-01-02" }}'
        html: '{{ template "email.html" . }}'
        text: '{{ template "email.text" . }}'
        send_resolved: false  # Don't send resolved for summaries

