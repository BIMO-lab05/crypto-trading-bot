# Prometheus Configuration
# Scrapes metrics from all microservices
# Last Updated: 2025-11-21

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'crypto-bot-production'
    environment: 'production'

# AlertManager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Trading Engine
  - job_name: 'trading-engine'
    static_configs:
      - targets: ['trading-engine:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Market Data Service
  - job_name: 'market-data-service'
    static_configs:
      - targets: ['market-data-service:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Technical Analysis
  - job_name: 'technical-analysis'
    static_configs:
      - targets: ['technical-analysis:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Portfolio Manager
  - job_name: 'portfolio-manager'
    static_configs:
      - targets: ['portfolio-manager:8004']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Bybit Connector
  - job_name: 'bybit-connector'
    static_configs:
      - targets: ['bybit-connector:8005']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Risk Metrics Service
  - job_name: 'risk-metrics-service'
    static_configs:
      - targets: ['risk-metrics-service:8006']
    metrics_path: '/metrics'

  # ML Prediction Service
  - job_name: 'ml-prediction-service'
    static_configs:
      - targets: ['ml-prediction:8007']
    metrics_path: '/metrics'

  # Sentiment Analysis Service
  - job_name: 'sentiment-analysis-service'
    static_configs:
      - targets: ['sentiment-analysis:8008']
    metrics_path: '/metrics'

  # Signal Aggregator Service
  - job_name: 'signal-aggregator-service'
    static_configs:
      - targets: ['signal-aggregator:8009']
    metrics_path: '/metrics'

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (Container Metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
