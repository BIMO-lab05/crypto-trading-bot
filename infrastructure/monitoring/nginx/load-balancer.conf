# =============================================================================
# NGINX Load Balancer Configuration
# Crypto Trading Bot - Phase 7: High Availability & Advanced Monitoring
# Version: 1.0.0
# =============================================================================
#
# Features:
# - Health-check-based routing
# - Weighted round-robin load balancing
# - Connection limits and rate limiting
# - SSL/TLS termination
# - WebSocket support for real-time data
# - Request/response buffering optimization
# - Comprehensive logging for observability

# -----------------------------------------------------------------------------
# WORKER CONFIGURATION
# -----------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # =========================================================================
    # BASIC SETTINGS
    # =========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimize file transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Buffer sizes
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 8k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;
    gzip_min_length 1000;

    # =========================================================================
    # LOGGING CONFIGURATION (Prometheus-compatible)
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # JSON logging for structured log aggregation
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id"'
        '}';

    # Prometheus metrics format
    log_format prometheus 'nginx_http_requests_total{method="$request_method",'
                         'status="$status",upstream="$upstream_addr"} 1';

    access_log /var/log/nginx/access.log json_combined;

    # =========================================================================
    # RATE LIMITING ZONES
    # =========================================================================
    # General API rate limit: 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Trading endpoints: Stricter limit
    limit_req_zone $binary_remote_addr zone=trading_limit:10m rate=20r/s;

    # Health check endpoints: Very permissive
    limit_req_zone $binary_remote_addr zone=health_limit:1m rate=1000r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # UPSTREAM DEFINITIONS (Service Groups)
    # =========================================================================

    # API Gateway cluster
    upstream api_gateway {
        least_conn;
        keepalive 32;

        server api-gateway-1:8000 weight=5 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8000 weight=5 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8000 weight=5 max_fails=3 fail_timeout=30s backup;
    }

    # Trading Engine cluster (sticky sessions for consistency)
    upstream trading_engine {
        ip_hash;
        keepalive 16;

        server trading-engine-1:8001 weight=5 max_fails=2 fail_timeout=10s;
        server trading-engine-2:8001 weight=5 max_fails=2 fail_timeout=10s;
    }

    # Market Data Service cluster
    upstream market_data {
        least_conn;
        keepalive 64;

        server market-data-1:8002 weight=5 max_fails=3 fail_timeout=30s;
        server market-data-2:8002 weight=5 max_fails=3 fail_timeout=30s;
    }

    # Technical Analysis cluster
    upstream technical_analysis {
        least_conn;
        keepalive 16;

        server technical-analysis-1:8003 weight=5 max_fails=3 fail_timeout=30s;
        server technical-analysis-2:8003 weight=3 max_fails=3 fail_timeout=30s;
    }

    # Portfolio Manager cluster
    upstream portfolio_manager {
        ip_hash;
        keepalive 16;

        server portfolio-manager-1:8004 weight=5 max_fails=2 fail_timeout=10s;
        server portfolio-manager-2:8004 weight=5 max_fails=2 fail_timeout=10s;
    }

    # Bybit Connector (single instance - external API connector)
    upstream bybit_connector {
        server bybit-connector:8005 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # Notification Service cluster
    upstream notification_service {
        least_conn;
        keepalive 8;

        server notification-service-1:8006 weight=5;
        server notification-service-2:8006 weight=5;
    }

    # ML Prediction Service cluster
    upstream ml_prediction {
        least_conn;
        keepalive 8;

        server ml-prediction-1:8007 weight=5 max_fails=3 fail_timeout=60s;
        server ml-prediction-2:8007 weight=5 max_fails=3 fail_timeout=60s;
    }

    # Risk Metrics Service cluster
    upstream risk_metrics {
        least_conn;
        keepalive 8;

        server risk-metrics-1:8009 weight=5 max_fails=3 fail_timeout=30s;
        server risk-metrics-2:8009 weight=5 max_fails=3 fail_timeout=30s;
    }

    # WebSocket upstream for real-time data
    upstream websocket_backend {
        least_conn;
        keepalive 128;

        server market-data-ws-1:8002;
        server market-data-ws-2:8002;
    }

    # Prometheus/Grafana monitoring
    upstream prometheus {
        server prometheus:9090;
    }

    upstream grafana {
        server grafana:3000;
    }

    # =========================================================================
    # MAIN SERVER BLOCK - HTTPS
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.crypto-trading-bot.local;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Request ID for tracing
        set $request_id $request_id;
        if ($request_id = '') {
            set $request_id $msec$connection;
        }
        add_header X-Request-ID $request_id;

        # Connection limits
        limit_conn conn_limit 100;

        # ---------------------------------------------------------------------
        # HEALTH CHECK ENDPOINTS
        # ---------------------------------------------------------------------
        location /health {
            limit_req zone=health_limit burst=100 nodelay;
            proxy_pass http://api_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /ready {
            limit_req zone=health_limit burst=100 nodelay;
            proxy_pass http://api_gateway/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Nginx health check (for load balancer health)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------------------------
        # API GATEWAY ROUTES
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_gateway/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 24k;
        }

        # ---------------------------------------------------------------------
        # TRADING ENGINE ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/trading/ {
            limit_req zone=trading_limit burst=10 nodelay;

            proxy_pass http://trading_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # Shorter timeouts for trading - fail fast
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # MARKET DATA ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/market/ {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://market_data/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Cache market data for 1 second
            proxy_cache_valid 200 1s;
        }

        # ---------------------------------------------------------------------
        # WEBSOCKET ROUTES (Real-time data)
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://websocket_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket specific timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # PORTFOLIO MANAGEMENT ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/portfolio/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://portfolio_manager/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # TECHNICAL ANALYSIS ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/analysis/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://technical_analysis/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # RISK METRICS ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/risk/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://risk_metrics/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # ML PREDICTION ROUTES
        # ---------------------------------------------------------------------
        location /api/v1/ml/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://ml_prediction/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # Longer timeouts for ML predictions
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ---------------------------------------------------------------------
        # MONITORING ROUTES
        # ---------------------------------------------------------------------
        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # METRICS ENDPOINT (for Prometheus scraping)
        # ---------------------------------------------------------------------
        location /metrics {
            stub_status on;
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ---------------------------------------------------------------------
        # ERROR PAGES
        # ---------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # HTTP TO HTTPS REDIRECT
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.crypto-trading-bot.local;

        # Allow health checks over HTTP
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # INTERNAL METRICS SERVER (for Prometheus)
    # =========================================================================
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
