version: '3.8'

# PostgreSQL Streaming Replication Setup
# Primary-Replica configuration for high availability

services:
  # Primary PostgreSQL Database
  postgres-primary:
    image: postgres:15-alpine
    container_name: crypto-bot-postgres-primary
    environment:
      POSTGRES_DB: cryptobot
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - crypto-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Replica 1 - Hot Standby
  postgres-replica-1:
    image: postgres:15-alpine
    container_name: crypto-bot-postgres-replica-1
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./replica/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./replica/standby.signal:/var/lib/postgresql/data/standby.signal
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    networks:
      - crypto-bot-network
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Replica 2 - Hot Standby (for read scaling)
  postgres-replica-2:
    image: postgres:15-alpine
    container_name: crypto-bot-postgres-replica-2
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./replica/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./replica/standby.signal:/var/lib/postgresql/data/standby.signal
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5434:5432"
    networks:
      - crypto-bot-network
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer - Connection Pooling & Load Balancing
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: crypto-bot-pgbouncer
    environment:
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_USER: cryptobot
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
    ports:
      - "6432:5432"
    networks:
      - crypto-bot-network
    depends_on:
      - postgres-primary
      - postgres-replica-1
      - postgres-replica-2

  # HAProxy - High Availability Proxy
  haproxy:
    image: haproxy:2.8-alpine
    container_name: crypto-bot-haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5000:5000"  # Primary (read-write)
      - "5001:5001"  # Replicas (read-only)
      - "8404:8404"  # Stats page
    networks:
      - crypto-bot-network
    depends_on:
      - postgres-primary
      - postgres-replica-1
      - postgres-replica-2

  # Patroni - Automatic Failover (Optional but recommended)
  patroni-primary:
    image: patroni/patroni:latest
    container_name: crypto-bot-patroni-primary
    environment:
      PATRONI_NAME: patroni-primary
      PATRONI_SCOPE: crypto-bot-cluster
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_ETCD_HOST: etcd:2379
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./patroni/patroni.yml:/etc/patroni.yml
    networks:
      - crypto-bot-network
    depends_on:
      - etcd

  # etcd - Distributed configuration for Patroni
  etcd:
    image: quay.io/coreos/etcd:latest
    container_name: crypto-bot-etcd
    environment:
      ETCD_NAME: etcd0
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: crypto-bot-cluster
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - crypto-bot-network

volumes:
  postgres-primary-data:
    driver: local
  postgres-replica-1-data:
    driver: local
  postgres-replica-2-data:
    driver: local

networks:
  crypto-bot-network:
    driver: bridge
