# HAProxy Configuration for PostgreSQL High Availability
# Provides automatic failover and load balancing

global
    maxconn 4096
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s

# Statistics page
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if TRUE

# Primary database (read-write)
frontend postgres_primary
    bind *:5000
    default_backend postgres_primary_backend

backend postgres_primary_backend
    option httpchk GET /health
    http-check expect status 200
    server primary postgres-primary:5432 check port 8008

# Replicas (read-only)
frontend postgres_replicas
    bind *:5001
    default_backend postgres_replicas_backend

backend postgres_replicas_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server replica1 postgres-replica-1:5432 check port 8008
    server replica2 postgres-replica-2:5432 check port 8008
