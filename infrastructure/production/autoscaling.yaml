---
# Pod Disruption Budget for Trading Engine - Ensure availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-engine-pdb
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    service: trading-engine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: trading-engine

