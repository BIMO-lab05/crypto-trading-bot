# =============================================================================
# Production Microservices Deployment
# =============================================================================
# Version: 1.0
# Created: 2025-12-12
# Environment: Production
#
# All microservices configured with:
# - Security hardening (non-root, dropped capabilities)
# - Resource limits and requests
# - Health checks (liveness, readiness, startup)
# - Prometheus metrics
# - Anti-affinity for high availability
# =============================================================================

---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    service: api-gateway
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crypto-trading-bot
      service: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: crypto-trading-bot
        service: api-gateway
        environment: production
        security-hardened: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api-gateway-sa
      priorityClassName: crypto-bot-critical
      containers:
      - name: api-gateway
        image: crypto-trading-bot/api-gateway:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: api-secrets
        - secretRef:
            name: db-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  service: api-gateway
              topologyKey: kubernetes.io/hostname

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    service: api-gateway
spec:
  type: ClusterIP
  selector:
    app: crypto-trading-bot
    service: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http

