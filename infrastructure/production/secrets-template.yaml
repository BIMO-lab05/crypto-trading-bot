# =============================================================================
# Production Secrets Template for Crypto Trading Bot
# =============================================================================
# Version: 1.0
# Created: 2025-12-12
# Environment: Production
#
# WARNING: DO NOT COMMIT ACTUAL SECRETS TO VERSION CONTROL
# This is a TEMPLATE file. Replace CHANGE_ME_* values with real secrets
# before applying to your cluster.
#
# RECOMMENDED: Use External Secrets Operator with HashiCorp Vault, AWS Secrets
# Manager, or Azure Key Vault for production secret management.
#
# To apply:
#   1. Copy this file: cp secrets-template.yaml secrets.yaml
#   2. Replace all CHANGE_ME_* values with real secrets
#   3. Apply: kubectl apply -f secrets.yaml
#   4. Delete the file: rm secrets.yaml (don't commit real secrets!)
# =============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: database
type: Opaque
stringData:
  # PostgreSQL Configuration
  # Generate with: openssl rand -base64 32
  POSTGRES_USER: "cryptobot_prod"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  POSTGRES_DB: "crypto_trading_prod"

  # TimescaleDB Configuration
  TIMESCALE_USER: "timescale_prod"
  TIMESCALE_PASSWORD: "CHANGE_ME_TIMESCALE_PASSWORD"
  TIMESCALE_DB: "market_data_prod"

  # Redis Configuration
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

  # RabbitMQ Configuration
  RABBITMQ_USER: "rabbitmq_prod"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"

  # Database URLs (assembled from above)
  DATABASE_URL: "postgresql://cryptobot_prod:CHANGE_ME_POSTGRES_PASSWORD@postgres-service:5432/crypto_trading_prod"
  TIMESCALE_URL: "postgresql://timescale_prod:CHANGE_ME_TIMESCALE_PASSWORD@timescale-service:5432/market_data_prod"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis-service:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq_prod:CHANGE_ME_RABBITMQ_PASSWORD@rabbitmq-service:5672/production"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: api
type: Opaque
stringData:
  # JWT Configuration
  # Generate with: openssl rand -hex 64
  JWT_SECRET_KEY: "CHANGE_ME_JWT_SECRET_KEY_MINIMUM_64_CHARACTERS_FOR_HS512"
  JWT_ALGORITHM: "HS512"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # API Security
  API_ADMIN_KEY: "CHANGE_ME_API_ADMIN_KEY"
  CORS_ALLOWED_ORIGINS: "https://trading.yourdomain.com,https://dashboard.yourdomain.com"

  # Encryption Key for sensitive data at rest
  # Generate with: openssl rand -hex 32
  ENCRYPTION_KEY: "CHANGE_ME_ENCRYPTION_KEY_64_HEX_CHARACTERS"

---
apiVersion: v1
kind: Secret
metadata:
  name: bybit-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: exchange
type: Opaque
stringData:
  # Bybit LIVE API Keys - HANDLE WITH EXTREME CARE
  # These keys have real trading authority
  BYBIT_API_KEY: "CHANGE_ME_BYBIT_API_KEY"
  BYBIT_API_SECRET: "CHANGE_ME_BYBIT_API_SECRET"

  # Additional Exchange Configuration
  BYBIT_RECV_WINDOW: "5000"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: notifications
type: Opaque
stringData:
  # Telegram Notifications
  TELEGRAM_BOT_TOKEN: "CHANGE_ME_TELEGRAM_BOT_TOKEN"
  TELEGRAM_CHAT_ID: "CHANGE_ME_TELEGRAM_CHAT_ID"

  # Email Notifications (SMTP)
  SMTP_HOST: "smtp.yourdomain.com"
  SMTP_PORT: "587"
  SMTP_USER: "alerts@yourdomain.com"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  ALERT_EMAIL_RECIPIENTS: "trading-team@yourdomain.com,devops@yourdomain.com"

  # PagerDuty Integration (optional)
  PAGERDUTY_SERVICE_KEY: "CHANGE_ME_PAGERDUTY_KEY"

  # Slack Integration (optional)
  SLACK_WEBHOOK_URL: "CHANGE_ME_SLACK_WEBHOOK_URL"

---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: monitoring
type: Opaque
stringData:
  # Grafana Admin
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"

  # AlertManager Configuration
  ALERTMANAGER_WEBHOOK_URL: "CHANGE_ME_ALERTMANAGER_WEBHOOK"

---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secrets
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: tls
type: kubernetes.io/tls
data:
  # TLS Certificate (base64 encoded)
  # Generate with: cat cert.pem | base64 -w 0
  tls.crt: "CHANGE_ME_TLS_CERTIFICATE_BASE64"
  # TLS Private Key (base64 encoded)
  # Generate with: cat key.pem | base64 -w 0
  tls.key: "CHANGE_ME_TLS_PRIVATE_KEY_BASE64"

---
# Secret for Docker Registry authentication (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: crypto-bot-prod
  labels:
    app: crypto-trading-bot
    component: secrets
    environment: production
    secret-type: registry
type: kubernetes.io/dockerconfigjson
data:
  # Docker config.json (base64 encoded)
  # Generate with: cat ~/.docker/config.json | base64 -w 0
  .dockerconfigjson: "CHANGE_ME_DOCKER_CONFIG_BASE64"
