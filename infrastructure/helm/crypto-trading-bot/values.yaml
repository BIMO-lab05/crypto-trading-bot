# =============================================================================
# POSTGRESQL DATABASE
# Main relational database for transactional data
# =============================================================================
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"

  # StatefulSet replicas
  replicaCount: 1

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  # Persistence configuration
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # Use default
    accessMode: ReadWriteOnce

  # PostgreSQL configuration
  config:
    maxConnections: 200
    sharedBuffers: "1GB"
    effectiveCacheSize: "3GB"
    maintenanceWorkMem: "256MB"
    walLevel: "replica"
    maxWalSize: "2GB"

  # Backup configuration
  backup:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    retention: 7  # Keep 7 days of backups

# =============================================================================
# TIMESCALEDB
# Time-series database for market data
# =============================================================================
timescaledb:
  enabled: true

  image:
    repository: timescale/timescaledb
    tag: "2.13.1-pg16"

  replicaCount: 1

  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 2000m
      memory: 2Gi

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  config:
    maxConnections: 300
    sharedBuffers: "2GB"
    effectiveCacheSize: "6GB"
    maintenanceWorkMem: "512MB"
    workMem: "16MB"

  # TimescaleDB specific settings
  timescale:
    compressionEnabled: true
    retentionDays: 365
    chunkTimeInterval: "1 day"

# =============================================================================
# REDIS
# Caching and session storage
# =============================================================================
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"

  replicaCount: 1

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  config:
    maxmemory: "1gb"
    maxmemoryPolicy: "allkeys-lru"
    appendonly: "yes"
    saveInterval: "60 1000"

# =============================================================================
# RABBITMQ
# Message broker for inter-service communication
# =============================================================================
rabbitmq:
  enabled: true

  image:
    repository: rabbitmq
    tag: "3.12-management-alpine"

  replicaCount: 1

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # RabbitMQ management UI
  management:
    enabled: true
    service:
      type: ClusterIP
      port: 15672

  config:
    vmMemoryHighWatermark: 0.8
    diskFreeLimit: "1GB"

# =============================================================================
# PROMETHEUS
# Metrics collection and monitoring
# =============================================================================
prometheus:
  enabled: true

  image:
    repository: prom/prometheus
    tag: "v2.48.0"

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi

  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Retention period
  retention: 15d

  # Scrape interval
  scrapeInterval: 15s

  # Service monitors
  serviceMonitor:
    enabled: true

  # Alert manager
  alertmanager:
    enabled: true

# =============================================================================
# GRAFANA
# Metrics visualization
# =============================================================================
grafana:
  enabled: true

  image:
    repository: grafana/grafana
    tag: "10.2.2"

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Admin credentials (use secret in production)
  adminUser: admin
  adminPasswordSecret: grafana-secret
  adminPasswordKey: password

  # Ingress for Grafana
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: grafana.cryptobot.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.cryptobot.example.com

  # Data sources
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      isDefault: true
