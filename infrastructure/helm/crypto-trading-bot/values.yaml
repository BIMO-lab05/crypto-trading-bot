# Default values for crypto-trading-bot
# This is a YAML-formatted file for configuring all microservices and infrastructure
# Declare variables to be passed into your templates

# =============================================================================
# GLOBAL CONFIGURATION
# These settings are shared across all subcharts
# =============================================================================
global:
  # Container image configuration
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
    # - name: regcred

  # Environment identifier
  environment: production

  # Kubernetes namespace
  namespace: crypto-bot

  # Storage configuration
  storageClass: standard

  # Database connection settings
  postgresql:
    host: postgresql
    port: 5432
    database: cryptobot
    username: cryptobot
    # Password should be stored in external secret management
    existingSecret: postgresql-secret
    existingSecretPasswordKey: password

  # TimescaleDB connection settings
  timescaledb:
    host: timescaledb
    port: 5432
    database: marketdata
    username: timescale
    existingSecret: timescaledb-secret
    existingSecretPasswordKey: password

  # Redis connection settings
  redis:
    host: redis
    port: 6379
    database: 0
    existingSecret: redis-secret
    existingSecretPasswordKey: password

  # RabbitMQ connection settings
  rabbitmq:
    host: rabbitmq
    port: 5672
    managementPort: 15672
    username: admin
    existingSecret: rabbitmq-secret
    existingSecretPasswordKey: password

  # Bybit API configuration (testnet by default)
  bybit:
    apiUrl: https://api-testnet.bybit.com
    wsUrl: wss://stream-testnet.bybit.com
    existingSecret: bybit-secret
    existingSecretApiKeyKey: api-key
    existingSecretApiSecretKey: api-secret

  # Monitoring configuration
  metrics:
    enabled: true
    serviceMonitor: true
    port: 9090
    path: /metrics

  # Logging configuration
  logging:
    level: INFO
    format: json

  # Security context for all pods
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Network policies
  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress

  # Pod disruption budgets
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# =============================================================================
# API GATEWAY SERVICE
# Entry point for all external API requests
# =============================================================================
api-gateway:
  enabled: true

  # Number of replicas
  replicaCount: 3

  # Container image
  image:
    repository: crypto-bot/api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Horizontal Pod Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Service configuration
  service:
    type: LoadBalancer
    port: 8000
    targetPort: 8000
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: api.cryptobot.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-gateway-tls
        hosts:
          - api.cryptobot.example.com

  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

  # Environment variables
  env:
    - name: LOG_LEVEL
      value: "INFO"
    - name: CORS_ORIGINS
      value: "https://cryptobot.example.com"
    - name: MAX_CONNECTIONS
      value: "1000"

  # Pod annotations
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - api-gateway
            topologyKey: kubernetes.io/hostname

# =============================================================================
# TRADING ENGINE SERVICE
# Core trading logic and strategy execution
# =============================================================================
trading-engine:
  enabled: true
  replicaCount: 2

  image:
    repository: crypto-bot/trading-engine
    tag: "1.0.0"

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  service:
    type: ClusterIP
    port: 8001

  livenessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 60
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /ready
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 10

  env:
    - name: MAX_POSITION_SIZE_PERCENT
      value: "2.0"
    - name: STOP_LOSS_PERCENT
      value: "5.0"
    - name: PAPER_TRADING
      value: "true"

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"

