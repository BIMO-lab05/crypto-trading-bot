# PostgreSQL - Production Settings
postgresql:
  replicaCount: 1  # Consider using PostgreSQL HA solution for production

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  persistence:
    enabled: true
    size: 20Gi
    storageClass: premium-ssd

  backup:
    enabled: true
    schedule: "0 2 * * *"
    retention: 14  # Keep 2 weeks of backups

  # High availability configuration
  replication:
    enabled: true
    replicas: 2

# TimescaleDB - Production Settings
timescaledb:
  replicaCount: 1

  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 2000m
      memory: 2Gi

  persistence:
    enabled: true
    size: 100Gi
    storageClass: premium-ssd

  timescale:
    compressionEnabled: true
    retentionDays: 365
    chunkTimeInterval: "1 day"

  backup:
    enabled: true
    schedule: "0 3 * * *"
    retention: 30

