# Production Environment Overrides
# Full production configuration with high availability and performance

global:
  environment: production
  imageRegistry: your-registry.azurecr.io
  imagePullPolicy: IfNotPresent

  # Production Bybit API
  bybit:
    apiUrl: https://api.bybit.com
    wsUrl: wss://stream.bybit.com

  # Production logging
  logging:
    level: INFO
    format: json

  # Enable all security features
  networkPolicy:
    enabled: true

  podDisruptionBudget:
    enabled: true
    minAvailable: 2  # Higher availability in production

# API Gateway - Production Settings
api-gateway:
  replicaCount: 5

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "false"

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: api.cryptobot.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-gateway-prod-tls
        hosts:
          - api.cryptobot.example.com

  # Production affinity rules
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api-gateway
          topologyKey: kubernetes.io/hostname

# Trading Engine - Production Settings
trading-engine:
  replicaCount: 3

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  env:
    - name: MAX_POSITION_SIZE_PERCENT
      value: "2.0"
    - name: STOP_LOSS_PERCENT
      value: "5.0"
    - name: PAPER_TRADING
      value: "false"  # Real trading in production (ensure proper authorization!)

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - trading-engine
          topologyKey: kubernetes.io/hostname

# Portfolio Manager - Production Settings
portfolio-manager:
  replicaCount: 3

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

