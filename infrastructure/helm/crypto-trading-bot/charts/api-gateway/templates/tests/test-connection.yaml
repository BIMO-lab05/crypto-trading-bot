apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "api-gateway.fullname" . }}-test-connection"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
    app: api-gateway
    test: connection
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:latest
      command: ['wget']
      args: ['{{ include "api-gateway.fullname" . }}:{{ .Values.service.port }}/health']
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
