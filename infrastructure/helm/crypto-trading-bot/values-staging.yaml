# Staging Environment Overrides
# Production-like environment for testing with moderate resources

global:
  environment: staging
  imageRegistry: your-registry.azurecr.io
  imagePullPolicy: IfNotPresent

  # Use testnet but with production-like settings
  bybit:
    apiUrl: https://api-testnet.bybit.com
    wsUrl: wss://stream-testnet.bybit.com

  # Production-level logging
  logging:
    level: INFO
    format: json

  # Enable network policies
  networkPolicy:
    enabled: true

# API Gateway - Staging Settings
api-gateway:
  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  service:
    type: LoadBalancer

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: api-staging.cryptobot.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-gateway-staging-tls
        hosts:
          - api-staging.cryptobot.example.com

# Trading Engine - Staging Settings
trading-engine:
  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  env:
    - name: MAX_POSITION_SIZE_PERCENT
      value: "1.5"
    - name: PAPER_TRADING
      value: "true"  # Still paper trading in staging

